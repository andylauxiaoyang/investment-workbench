.src-pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:var(--fs-2xs);color:var(--txt2);display:inline-flex;gap:6px;align-items:center}
.src-pill b{color:var(--down)}

nav.views{margin:-1px 0 0;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
nav.views button{appearance:none;border:0;background:none;font-family:inherit;font-size:var(--fs-md);color:var(--txt2);padding:12px 16px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;position:relative}
nav.views button.on{color:var(--txt);font-weight:600;border-bottom-color:var(--accent)}
nav.views button .cnt{font-size:var(--fs-2xs);color:var(--txt3);font-weight:600;margin-left:3px}
main{margin:20px 0 40px;padding:0 16px}
.view{display:none} .view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin-bottom:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px;flex-wrap:wrap}
.sec-head h2{font-size:var(--fs-lg);font-weight:700}
.sec-head .hint{font-size:var(--fs-xs);color:var(--txt2)}
/* hero 4-grid (magnetic tiles) */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
.hk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;position:relative;overflow:hidden}
.hk .k{font-size:var(--fs-xs);color:var(--txt2);margin-bottom:6px;letter-spacing:.3px}
.hk .v{font-size:var(--fs-2xl);font-weight:700;font-family:var(--mono);letter-spacing:-.5px}
.hk .s{font-size:var(--fs-2xs);color:var(--txt2);margin-top:4px}
.hk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.hk.g::before{background:#0d9488}.hk.r::before{background:#7c3aed}.hk.o::before{background:#d97706}.hk.p::before{background:#2563eb}
/* two-col */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.row:hover{border-color:#c9d2e0;box-shadow:var(--shadow)}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:var(--fs-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sm{font-size:var(--fs-xs);color:var(--txt2)}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;border-top:3px solid var(--accent)}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.12)}
.tile .t{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tile .t b{font-size:var(--fs-md);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .metrics{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--txt2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tile .metrics .v{font-family:var(--mono);font-weight:600;font-size:var(--fs-md);color:var(--txt)}
.flows{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* filter bar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.searchbox{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.searchbox input{border:0;background:none;font-family:inherit;font-size:var(--fs-md);padding:10px 0;width:100%;outline:none;color:var(--txt)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:20px;padding:5px 12px;font-size:var(--fs-xs);cursor:pointer;font-family:inherit}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:600}
select.sel{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 30px 9px 12px;font-size:var(--fs-sm);font-family:inherit;color:var(--txt);cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239aa1ac'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
/* tables */

.mono{font-family:var(--mono)}
/* detail modal */

         "险资":"#d97706","券商":"#64748b","公募·主动":"#7c3aed","私募":"#e11d48"};

function pctCell(v){return v!=null?(+v).toFixed(2)+'%':'—';}
function hjDraw(hj,year,period){
  // 返回该ETF一年汇金(投资/资产/单一计划)的三段描述 + 合计
  if(!hj||!hj.total_shares)return '<span class="mut">—</span>';
  var parts=[];
  if(hj.inv)parts.push('<span class="mut">投资</span> '+fmt(hj.inv.shares)+' <span class="num up">'+hj.inv.pct+'%</span>');
  if(hj.asset)parts.push('<span class="mut">资产</span> '+fmt(hj.asset.shares)+' <span class="num up">'+hj.asset.pct+'%</span>');
  if(hj.plan)parts.push('<span class="mut">单一计划</span> '+fmt(hj.plan.shares)+' <span class="num up">'+hj.plan.pct+'%</span>');
  return parts.join('<br>');
}

  rows.forEach(function(r){var hj=r.name.indexOf('汇金')>=0;
    hh+='<tr><td class="mut">'+r.rank+'</td><td>'+esc(r.name)+(hj?' <span class="badge up" style="background:#fef3c7;color:#b45309">汇金</span>':'')+'</td>'
       +'<td class="num">'+fmtNum(r.shares)+'</td><td class="num '+(hj?'up':'')+'">'+r.pct+'%</td></tr>';});
  hh+='</tbody></table></div>';

  dh+='<div class="kpi"><div class="k">本季持仓市值('+qLabel(q)+')</div><div class="v">'+fmt(mk)+'</div></div>';
  dh+='<div class="kpi"><div class="k">持仓覆盖股票</div><div class="v">'+codes.length+'</div></div>';
  dh+='<div class="kpi"><div class="k">本季净变动(score)</div><div class="v '+(qo.score>0?'up':qo.score<0?'down':'')+'">'+qo.score+'</div></div>';
  dh+='<div class="kpi"><div class="k">新进/增持/减持/清仓</div><div class="v"><span class="down" style="font-size:var(--fs-md)">'+qo.newly.length+'/'+qo.adds.length+'/'+qo.trims.length+'/'+qo.exits.length+'</span></div></div>';
  dh+='</div>';
  dh+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">';
  dh+='<div class="tab-row" id="qTabs">'+PQ.map(function(qq){return '<button class="qtab'+(qq===q?' on':'')+'" data-q="'+qq+'">'+qLabel(qq)+'</button>';}).join('')+'</div>';
  dh+='<div style="flex:1"></div>';
  dh+='<div class="mode-switch"><button data-m="simple" class="'+(st.dMode==='simple'?'on':'')+'">简明</button><button data-m="pro" class="'+(st.dMode==='pro'?'on':'')+'">专业</button></div>';
  var bb=[['mk','按持仓市值'],['score','按本季变动']].map(function(o){return '<button class="qtab'+(st.dSort===o[0]?' on':'')+'" data-ds="'+o[0]+'">'+o[1]+'</button>';}).join('');
  dh+='<div class="tab-row" id="dSortTabs">'+bb+'</div>';
  dh+='</div></div>';
  dh+='<div class="dbody">';
  if(st.dMode==='simple')dh+=simpleBody(x,q,codes,pos,qo);
  else dh+=proBody(x,q,codes,pos,qo,mk);
  dh+='</div>';
  $('#detailBox').innerHTML=dh;
  document.querySelectorAll('#qTabs .qtab').forEach(function(b){b.onclick=function(){st.dQ=b.dataset.q;renderDetail();};});
  document.querySelectorAll('.mode-switch button').forEach(function(b){b.onclick=function(){st.dMode=b.dataset.m;renderDetail();};});
  document.querySelectorAll('#dSortTabs .qtab').forEach(function(b){b.onclick=function(){st.dSort=b.dataset.ds;renderDetail();};});
}
function simpleBody(x,q,codes,pos,qo){
  var rows=codes.map(function(c){return {c:c,pos:pos[c],m:moveOf(x,q,c)};});
  if(st.dSort==='mk')rows.sort(function(a,b){return (b.pos.mk||0)-(a.pos.mk||0);});
  else rows.sort(function(a,b){var s=function(z){return z.m==='new'?2:z.m==='add'?1:z.m==='trim'?-1:z.m==='exit'?-2:0;};return s(b)-s(a);});
  var h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>股票</th><th>行业</th><th class="num">持股(股)</th><th class="num">占股本%</th><th class="num">持仓市值</th><th>环比</th><th>动作</th></tr></thead><tbody>';
  rows.forEach(function(r){var s=ST[r.c];var m=r.m;
    h+='<tr><td><b>'+esc(s?s.name:r.c)+'</b><span class="mut mono"> '+r.c+'</span></td><td class="mut">'+esc(s?s.sector:'')+'</td>'
       +'<td class="num">'+fmtNum(r.pos.num)+'</td>'
       +'<td class="num">'+(r.pos.ratio!==null&&r.pos.ratio!==undefined?(+r.pos.ratio).toFixed(2)+'%':'—')+'</td>'
       +'<td class="num">'+fmt(r.pos.mk)+'</td>'
       +'<td>'+moveBadge(m)+'</td>'
       +'<td><a class="alt" onclick="lookupStock(\''+r.c+'\')">反查</a></td></tr>';});
  h+='</tbody></table></div>';
  if(!rows.length)h+='<div class="empty">本报告期在代表股池内无披露持仓（可能已跌出前十大或清仓）。</div>';
  return h;
}
function proBody(x,q,codes,pos,qo,mk){
  // 专业：全部 4 报告期对比矩阵
  var rowsObj={};
  PQ.forEach(function(qq){Object.keys(instPos(x,qq)).forEach(function(c){rowsObj[c]=1;});});
  var allC=Object.keys(rowsObj);
  var arr=allC.map(function(c){
    var seq=PQ.map(function(qq){var p=instPos(x,qq)[c];return {q:qq,n:p?p.num:null,r:p?p.ratio:null,m:p?p.mk:null};});
    return {c:c,seq:seq,m:moveOf(x,q,c)};
  });
  if(st.dSort==='mk')arr.sort(function(a,b){return (b.seq[PQ.length-1].m||0)-(a.seq[PQ.length-1].m||0);});
  else arr.sort(function(a,b){var s=function(z){return z.m==='new'?2:z.m==='add'?1:z.m==='trim'?-1:z.m==='exit'?-2:0;};return s(b.m)-s(a.m);});
  var h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>股票</th>'+PQ.map(function(qq){return '<th class="num">'+qLabel(qq)+' 持股</th>';}).join('')
       +'<th>本季动作</th></tr></thead><tbody>';
  arr.forEach(function(r){var s=ST[r.c];
    h+='<tr><td><b>'+esc(s?s.name:r.c)+'</b><span class="mut mono"> '+r.c+'</span></td>';
    for(var i=0;i<PQ.length;i++){var se=r.seq[i];var delta=null;
      if(i>0&&r.seq[i-1].n&&se.n){delta=((se.n-r.seq[i-1].n)/r.seq[i-1].n)*100;}
      h+='<td class="num">'+(se.n!=null?fmtNum(se.n):'—')+'<div style="font-size:var(--fs-2xs)">'+chgTag(delta)+'</div></td>';}
    h+='<td>'+moveBadge(r.m)+'</td></tr>';});
  h+='</tbody></table></div><div class="mut" style="font-size:var(--fs-xs);margin-top:8px">占比为占公司总股本比例；环比为本期 vs 上一报告期持股量变化（+红 -绿）。'+esc(D.meta.limitation)+'</div>';
  if(!arr.length)h='<div class="empty">本报告期在代表股池内无披露持仓。</div>';
  return h;
}
/* ============ 共识买入 ============ */
function renderConsensus(){
  var q=st.q;
  var rows=CONS.slice();
  if(st.fQ!=='all')rows=rows.filter(function(x){return (dirPrev(x)) ;});
  rows.sort(function(a,b){return b.nHolders-a.nHolders||b.net-a.net;});
  var h='<div class="sec"><div class="sec-head"><h2>共识买入 · 按共同持有机构数与本季变化</h2><span class="hint">统计截至 '+qLabel(q)+'：代表机构共同持有的股票，按共同机构数、本季净变动排序</span></div></div>';
  h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>股票</th><th>行业</th><th>共同机构</th><th>本季 增</th><th>本季 减</th><th class="num">净变动</th><th>共识</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var sign=r.net>=3&&r.add>=r.dec?'加仓一致':(r.net<=-3&&r.dec>=r.add?'减仓一致':(r.add&&r.dec?'分歧':'平稳'));
    var sc=r.sign||sign;
    var cls=sc==='加仓一致'?'up':sc==='减仓一致'?'down':(sc==='分歧'?'':'');
    h+='<tr><td><b>'+esc(r.name)+'</b><span class="mut mono"> '+r.code+'</span></td>'
       +'<td class="mut">'+esc(r.sector)+'</td>'
       +'<td class="num">'+r.nHolders+'</td>'
       +'<td class="num up">'+(r.new+r.add)+'</td>'
       +'<td class="num down">'+(r.dec+r.ex)+'</td>'
       +'<td class="num '+(r.net>0?'up':r.net<0?'down':'')+'">'+(r.net>0?'+':'')+r.net+'</td>'
       +'<td><span class="badge '+cls+'">'+sc+'</span></td>'
       +'<td><a class="alt" onclick="lookupStock(\''+r.code+'\')">反查</a></td></tr>';});
  h+='</tbody></table></div>';
  h+='<div class="sec-head" style="margin-top:16px"><h2>说明</h2><span class="hint"></span></div><div class="card" style="padding:14px 18px;font-size:var(--fs-xs);color:var(--txt2);line-height:1.8">共识依据代表机构在个股上的<strong>持股数量环比</strong>聚合：本季增 = 新进+增持机构数；本季减 = 减持+清仓机构数；净变动 = 增−减。仅代表股池内的披露口径，'+esc(D.meta.limitation)+'</div>';
  $('#view-consensus').innerHTML=h;
  var _=dirPrev;
}
function dirPrev(x){}/*noop guard*/
/* ============ 反查 ============ */
function renderLookup(){
  var h='<div class="sec"><div class="sec-head"><h2>股票 / 机构 反查</h2><span class="hint">输入 6 位代码、公司/机构名称关键字</span></div></div>';
  h+='<div class="toolbar"><div class="searchbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa1ac"><circle cx="11" cy="11" r="7" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-width="2"/></svg><input id="boxLk" placeholder="如 600519 / 茅台 / 汇金 / 社保持仓…"></div><button class="chip on" onclick="runLookup()">查询</button></div>';
  h+='<div class="lookup-res" id="lkRes"></div>';
  $('#view-lookup').innerHTML=h;
  var inp=$('#boxLk');inp.onkeydown=function(e){if(e.key==='Enter')runLookup();};
}
window.runLookup=function(){
  var v=($('#boxLk').value||'').trim().toLowerCase();var box=$('#lkRes');
  if(!v){box.innerHTML='<div class="empty">请输入关键字</div>';return;}
  // 匹配股票
  var codes=Object.keys(ST).filter(function(c){return c.indexOf(v)>=0||ST[c].name.toLowerCase().indexOf(v)>=0;});
  // 匹配机构
  var insts=INSTS.filter(function(x){return x.canon.toLowerCase().indexOf(v)>=0;});
  var h='';
  if(!codes.length&&!insts.length){box.innerHTML='<div class="empty">未匹配到股票或机构，试试代码或名称关键字</div>';return;}
  codes.slice(0,8).forEach(function(c){h+=stockCard(c);});
  insts.slice(0,6).forEach(function(x){h+=instCard(x);});
  if(!h)h='<div class="empty">无匹配</div>';
  box.innerHTML=h;
};
function stockCard(c){
  var s=ST[c];
  // 各期机构数
  var row='<div class="hitcard"><div class="h"><b>'+esc(s.name)+'</b><span class="mono mut">'+c+'</span><span class="mut">'+esc(s.sector)+'</span>'
    +'<a class="alt" style="margin-left:auto" onclick="lookupStock(\''+c+'\');setTimeout(renderLookup,0)">查看全部机构明细 →</a></div>';
  row+='<div style="margin-top:8px;display:grid;gap:4px">';
  PQ.forEach(function(qq){
    var holders=[];
    INSTS.forEach(function(x){var p=instPos(x,qq)[c];if(p)holders.push({canon:x.canon,m:moveOf(x,qq,c),mk:p.mk});});
    holders.sort(function(a,b){return (b.mk||0)-(a.mk||0);});
    row+='<div><span class="badge flat" style="min-width:52px">'+qLabel(qq)+'</span> <span class="mut">'+holders.length+' 家机构</span>';
    holders.forEach(function(hh){row+=' <span class="mono" style="font-size:var(--fs-xs)">'+esc(hh.canon)+'</span> '+moveBadge(hh.m)+' ';});
    row+='</div>';
  });
  row+='</div></div>';
  return row;
}
function instCard(x){
  var mk=x.q[qIndex2(LAST)].mktcap||0;
  return '<div class="hitcard" style="cursor:pointer" onclick="openInst(\''+x.id+'\')"><div class="h">'+
    instTileHeader(x)+'<span class="mut">持仓市值 '+fmt(mk)+'</span><span class="badge '+((x.qoq[LAST]||{score:0}).score>=0?'up':'down')+'">本季净变动 '+(x.qoq[LAST]||{score:0}).score+'</span></div>'+
    '<div class="mut" style="font-size:var(--fs-xs);margin-top:6px">点击查看该机构本季明细 →</div></div>';
}
/* 反查单股（从共识/详情跳转），在新页签呈现所有机构 */
window.lookupStock=function(c){
  go('lookup');setTimeout(function(){renderLookup();var box=$('#lkRes');
    var h='';h+=stockCard(c);box.innerHTML=h;},20);
  // 允许直接进入本股全部机构
  setTimeout(function(){var box=$('#lkRes');box.innerHTML=fullStock(c);},40);
};
function fullStock(c){
  var s=ST[c];
  var h='<div class="hitcard"><div class="h"><b>'+esc(s.name)+'</b><span class="mono mut">'+c+'</span><span class="mut">'+esc(s.sector)+'</span></div></div>';
  PQ.forEach(function(qq){
    var holders=[];
    INSTS.forEach(function(x){var p=instPos(x,qq)[c];if(p)holders.push({id:x.id,canon:x.canon,m:moveOf(x,qq,c),mk:p.mk,num:p.num});});
    holders.sort(function(a,b){return (b.mk||0)-(a.mk||0);});
    h+='<div class="hitcard"><div class="h"><b>'+qLabel(qq)+'</b><span class="mut"> '+holders.length+' 家机构持有</span></div>';
    if(holders.length)h+='<div style="margin-top:8px" class="tbl-wrap"><table class="tbl"><thead><tr><th>机构</th><th class="num">持股(股)</th><th class="num">占比%</th><th class="num">持仓市值</th><th>本季</th></tr></thead><tbody>'+
      holders.map(function(hh){return '<tr><td>'+esc(hh.canon)+'</td><td class="num">'+fmtNum(hh.num)+'</td><td class="num">'+((hh.p&&hh.p.ratio)!=null?fmtNum(hh.p.ratio):'—')+'</td><td class="num">'+fmt(hh.mk)+'</td><td>'+moveBadge(hh.m)+'</td></tr>';}).join('')+
      '</tbody></table></div>';
    else h+='<div class="mut" style="font-size:var(--fs-xs);margin-top:6px">本报告期代表机构在前十大内无披露持仓。</div>';
    h+='</div>';
  });
  return h;
}
/* ============ 页脚 ============ */
function renderFoot(){
  var h='<h4>数据口径与来源</h4><div><b>来源：</b>'+esc(D.meta.source)+'。'+esc(D.meta.universeNote)+'。<br>'
    +'<b>报告期与滞后：</b>'+esc(D.meta.quarterNote)+'（'+esc(D.meta.lag)+'）。A 股无 CUSIP，美式 13F 对标本表以 6 位证券代码 + 公司名映射。'+esc(D.meta.cusipNote)+'<br>'
    +'<b>生成时间：</b>'+esc(D.meta.generated)+'　<b>数据日期：</b>'+esc(D.meta.asOf)+'<br><br>'
    +'<b style="color:var(--txt)">重要声明：</b>'+esc(D.meta.disclaimer)+'。'+esc(D.meta.limitation)+'<br>'
    +'<span style="color:var(--txt3)">机构「代表人物/风格」为依据公开资料的分析性描述，不代表投资意见，亦不代表该机构当前实际操盘。数据为报告期末披露，存在 30–45 天滞后与前十股东口径局限。</span></div>';
  $('#footnote').innerHTML=h;
}
/* ============ 启动 ============ */
chipQ();renderNav();go('overview');renderFoot();
})();
</script>
<script>
/* fw2_v185_sm_resize：任一视图渲染/内容变化后把页高经 postMessage 上报父容器（同源/跨域均可用），
   父工作台据此动态撑高 iframe —— 根治「切换 tab 后底部被裁」与资料库轨固定 1400px 裁切。 */
(function () {
  function notify () {
    var h = document.documentElement ? document.documentElement.scrollHeight : 0;
    if (h > 200 && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ __smH: h }, '*'); } catch (e) {}
    }
  }
  setTimeout(notify, 120);
  var __t = null;
  var mo = new MutationObserver(function () {
    clearTimeout(__t); __t = setTimeout(notify, 160);
  });
  if (document.body && document.documentElement) {
    mo.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
})();
</script>
