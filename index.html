/* 统一回测引擎 —— 精确复刻 grid-investment-tracker SKILL v2.0.11 默认配置
 * 输入 rows: 升序 [[dateStr, nav], ...]（最旧在前，最新在后）
 * 三策略(grid/hold/pureDca) 与 SKILL compute_values / compute_pure_dca / expand_investment_plan 同口径
 * 已通过端到端对拍验证：同一份净值+同参数，JS 引擎与 SKILL Python 权威引擎全字段一致（差异 < 1e-3）
 */
const GRID_RULES = {
  m: { add_basis: "stage", arm_gain_threshold: 40,
       tiers: [{threshold:10,add_pct:10},{threshold:20,add_pct:20},{threshold:30,add_pct:30},{threshold:40,add_pct:40}],
       reset: { enabled: true, unlock_drawdown: 1 },
       cap: { type: "extra_vs_principal", max_pct: 100, principal_base: "lump_sum" } },
  i: { trigger_gain: 15, reduce_tiers: [15,25,30], floor_shares_pct: 20, reset_on_trigger: true },
  dca: { enabled: true, first_dca_multiple: 1.0,
         tiers: [{min:15,max:999,multiple:0.5},{min:8,max:15,multiple:0.7},{min:3,max:8,multiple:0.9},
                 {min:-3,max:3,multiple:1.0},{min:-8,max:-3,multiple:1.3},{min:-15,max:-8,multiple:1.6},{min:-999,max:-15,multiple:2.0}] },
  fee: { sub: 0.0015, red: 0.005 }, rf: 0.025
};

function expandPlan(rows, mode, baseAmt, dcaAmt, day, useDca, trackExcess) {
  const n = rows.length;
  const dates = rows.map(r => r[0]);
  const navs = rows.map(r => r[1]);
  const amounts = new Array(n).fill(0);
  const excess = new Array(n).fill(0);
  const DCA = GRID_RULES.dca;
  function dcaMult(prev, cur) {
    if (!DCA.enabled || !useDca) return 1.0;
    if (prev == null || cur == null || prev <= 0) return DCA.first_dca_multiple;
    const chg = (cur - prev) / prev * 100;
    for (const t of DCA.tiers) { if (chg >= t.min && chg < t.max) return t.multiple; }
    return 1.0;
  }
  const isLump = (mode === "lump" || mode === "lumponce");
  if (isLump) {
    amounts[0] = baseAmt;
  } else if (mode === "monthly" || mode === "lumponce_monthly") {
    const byMonth = {};
    for (let i = 0; i < n; i++) { const ym = dates[i].slice(0,7); (byMonth[ym] = byMonth[ym] || []).push(i); }
    const keys = Object.keys(byMonth).sort();
    let prevNav = null;
    for (const ym of keys) {
      const cands = byMonth[ym];
      let chosen = null;
      for (const i of cands) { if (parseInt(dates[i].slice(8,10)) >= day) { chosen = i; break; } }
      if (chosen == null) chosen = cands[cands.length - 1];
      const mult = dcaMult(prevNav, navs[chosen]);
      amounts[chosen] += dcaAmt * mult;
      if (mult > 1.0) excess[chosen] += dcaAmt * (mult - 1.0);
      prevNav = navs[chosen];
    }
  } else if (mode === "weekly" || mode === "lumponce_weekly") {
    const interval = Math.max(1, parseInt(day) || 5);
    let prevNav = null;
    for (let i = 0; i < n; i += interval) {
      const mult = dcaMult(prevNav, navs[i]);
      amounts[i] += dcaAmt * mult;
      if (mult > 1.0) excess[i] += dcaAmt * (mult - 1.0);
      prevNav = navs[i];
    }
  }
  return trackExcess ? [amounts, excess] : amounts;
}

function computeValues(dates, navs, investments, lumpSumTotal, dcaExcess) {
  const n = navs.length;
  const B = navs.slice(), D = investments.slice();
  const O_invest = new Array(n);
  for (let i = 0; i < n; i++) { O_invest[i] = D[i] + (i > 0 ? O_invest[i-1] : 0); }
  const U = new Array(n), V = new Array(n);
  for (let i = 0; i < n; i++) { U[i] = i === 0 ? B[i] : Math.max(B[i], U[i-1]); V[i] = (O_invest[i] > 0 && U[i] > 0) ? (U[i]-B[i])/U[i]*100 : 0; }
  let entry_idx = null;
  for (let i = 0; i < n; i++) { if (D[i] > 0) { entry_idx = i; break; } }
  const entry_nav = entry_idx !== null ? B[entry_idx] : null;
  let initial_principal = (lumpSumTotal != null) ? lumpSumTotal : D.reduce((a,b)=>a+b,0);
  const cost_nav = new Array(n); let _cinv = 0, _cshr = 0;
  for (let i = 0; i < n; i++) { _cinv += D[i]; _cshr += (B[i] > 0 ? D[i]/B[i] : 0); cost_nav[i] = _cshr > 0 ? _cinv/_cshr : 0; }
  const dd_arr = new Array(n), zone = new Array(n); let armed_peak = false;
  const m = GRID_RULES.m, armGain = m.arm_gain_threshold/100;
  for (let i = 0; i < n; i++) {
    const inLoss = cost_nav[i] > 0 && O_invest[i] > 0 && B[i] < cost_nav[i];
    if (inLoss) { zone[i] = "cost"; dd_arr[i] = (cost_nav[i] > 0 && O_invest[i] > 0) ? (cost_nav[i]-B[i])/cost_nav[i]*100 : 0; }
    else { zone[i] = "peak"; if (entry_nav && B[i] >= entry_nav*(1+armGain)) armed_peak = true; dd_arr[i] = armed_peak ? V[i] : 0; }
  }
  const mTiers = m.tiers, mResetOn = !!(m.reset && m.reset.enabled), mUnlock = (m.reset ? m.reset.unlock_drawdown : 5)/100;
  const mCapOn = m.cap && m.cap.type === "extra_vs_principal", mCapMax = (m.cap ? m.cap.max_pct : 100)/100;
  const trig_c = {10:false,20:false,30:false,40:false}, trig_p = {10:false,20:false,30:false,40:false};
  const M_add = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    let msum = 0;
    if (O_invest[i] > 0 && dd_arr[i] > 0) {
      const z = zone[i], dd = dd_arr[i]/100, trig = (z === "cost") ? trig_c : trig_p;
      if (mResetOn) { if (dd < mUnlock) { const arr = (z === "cost") ? trig_c : trig_p; for (const th of [10,20,30,40]) arr[th] = false; } }
      for (const t of mTiers) { if (dd > t.threshold/100 && !trig[t.threshold]) { msum += t.add_pct; trig[t.threshold] = true; } }
    }
    M_add[i] = msum/100;
  }
  const iR = GRID_RULES.i, triggerGain = iR.trigger_gain/100, reduceTiers = iR.reduce_tiers, floorShares = iR.floor_shares_pct/100;
  const I_val = new Array(n).fill(0); let reset_nav = entry_nav, trigCount = 0, remain = 1.0;
  for (let i = 0; i < n; i++) {
    let iv = 0;
    if (entry_nav && O_invest[i] > 0) {
      const gain = (reset_nav && reset_nav > 0) ? (B[i]/reset_nav - 1) : 0;
      if (gain >= triggerGain && remain > floorShares) {
        const tier = reduceTiers[Math.min(trigCount, reduceTiers.length-1)];
        iv = tier/100; trigCount++; remain *= (1 - tier/100);
        if (iR.reset_on_trigger) reset_nav = B[i];
      }
    }
    I_val[i] = iv;
  }
  const K_val = I_val, mBase = "net_holding_cost";
  const X = new Array(n), W = new Array(n), F = new Array(n), Q = new Array(n), L_val = new Array(n), N_add = new Array(n);
  let running_extra = 0.0;
  for (let i = 0; i < n; i++) {
    const k = K_val[i] || 0;
    if (i === 0) { X[i] = D[i]; W[i] = D[i]; F[i] = D[i]; Q[i] = D[i]; L_val[i] = 0; N_add[i] = 0; }
    else {
      const _base_prev = (mBase === "net_holding_cost") ? Q[i-1] : X[i-1];
      let add_amt = M_add[i] > 0 ? _base_prev * M_add[i] : 0;
      if (mCapOn) {
        let room = initial_principal * mCapMax - running_extra;
        if (add_amt > room) add_amt = Math.max(room, 0);
        running_extra += add_amt + (dcaExcess && dcaExcess[i] ? dcaExcess[i] : 0);
        M_add[i] = _base_prev > 0 ? add_amt/_base_prev : 0;
      }
      N_add[i] = add_amt;
      const grown = D[i] + N_add[i] + F[i-1]*(B[i]/B[i-1]);
      F[i] = grown * (1 - k);
      Q[i] = (D[i] + N_add[i] + Q[i-1]) * (1 - k);
      X[i] = D[i] + N_add[i] + X[i-1];
      W[i] = D[i] + N_add[i] + W[i-1]*(B[i]/B[i-1]);
      L_val[i] = grown * k;
    }
  }
  const cum_L = new Array(n); let run = 0;
  for (let i = 0; i < n; i++) { run += L_val[i]; cum_L[i] = run; }
  const wealth = new Array(n); for (let i = 0; i < n; i++) wealth[i] = F[i] + cum_L[i];
  const w_peak = new Array(n);
  w_peak[0] = wealth[0];
  for (let i = 1; i < n; i++) { w_peak[i] = Math.max(wealth[i], w_peak[i-1]); }
  let max_strat_dd = 0;
  for (let i = 0; i < n; i++) { if (w_peak[i] > 0 && O_invest[i] > 0) { const dd = (w_peak[i]-wealth[i])/w_peak[i]*100; if (dd > max_strat_dd) max_strat_dd = dd; } }
  const rets = [];
  for (let i = 1; i < n; i++) { if (O_invest[i] > 0) rets.push((B[i]-B[i-1])/B[i-1]); }
  let ann_vol = 0;
  if (rets.length > 1) { const mean = rets.reduce((a,b)=>a+b,0)/rets.length; let va = 0; for (const x of rets) va += (x-mean)**2; va /= (rets.length-1); ann_vol = Math.sqrt(va)*Math.sqrt(252)*100; }
  const S = new Array(n), T = new Array(n);
  for (let i = 0; i < n; i++) { S[i] = Q[i] > 0 ? (F[i]-Q[i])/Q[i]*100 : 0; }
  T[0] = S[0];
  for (let i = 1; i < n; i++) { T[i] = Q[i] > 0 ? Math.max(S[i], T[i-1]) : 0; }
  const bh_F = new Array(n);
  for (let i = 0; i < n; i++) { const contrib = D[i] + N_add[i]; bh_F[i] = i === 0 ? contrib : contrib + bh_F[i-1]*(B[i]/B[i-1]); }
  const sub = GRID_RULES.fee.sub, red = GRID_RULES.fee.red;
  const _cum_in = new Array(n); let _r = 0;
  for (let i = 0; i < n; i++) { _r += D[i] + N_add[i]; _cum_in[i] = _r; }
  const AG = new Array(n), AH = new Array(n);
  for (let i = 0; i < n; i++) { AG[i] = F[i] + cum_L[i] - _cum_in[i]*(1+sub) - cum_L[i]*red; AH[i] = _cum_in[i] > 0 ? AG[i]/(_cum_in[i]*(1+sub))*100 : 0; }
  const max_holding_cost = Math.max.apply(null, Q);
  const total_in = D.reduce((a,b)=>a+b,0), total_add = N_add.reduce((a,b)=>a+b,0), total_tp = L_val.reduce((a,b)=>a+b,0);
  return { B, D, F, Q, L_val, N_add, cum_L, wealth, max_strat_dd, ann_vol, bh_F, AG, AH, max_holding_cost,
           entry_nav, O_invest, X, total_in, total_add, total_tp, U, V, S, T, M_add, I_val };
}

function computePureDca(dates, navs, pdcaInv) {
  const n = navs.length, B = navs.slice(), IN = pdcaInv.slice();
  const pdca_F = new Array(n), pdca_X = new Array(n);
  for (let i = 0; i < n; i++) {
    if (i === 0) { pdca_X[i] = IN[i]; pdca_F[i] = IN[i]; }
    else { pdca_X[i] = IN[i] + pdca_X[i-1]; pdca_F[i] = IN[i] + pdca_F[i-1]*(B[i]/B[i-1]); }
  }
  return { pdca_F, pdca_X };
}

function runBacktest(rows, mode, base, dca, day) {
  const n = rows.length, dates = rows.map(r => r[0]), navs = rows.map(r => r[1]);
  const hasBase = (mode === "lump" || mode.startsWith("lumponce"));
  const baseAmt = hasBase ? base : 0, dcaAmt = (mode === "lump") ? 0 : dca;
  const ep = expandPlan(rows, mode, baseAmt, dcaAmt, day, true, true);
  const investments = ep[0], dcaExcess = ep[1];
  const lumpSumTotal = hasBase ? base : null;
  const c = computeValues(dates, navs, investments, lumpSumTotal, dcaExcess);
  const sub = GRID_RULES.fee.sub, red = GRID_RULES.fee.red, rf = GRID_RULES.rf;
  const days = Math.max(1, Math.round((new Date(dates[n-1]) - new Date(dates[0])) / 86400000));
  const annVol = c.ann_vol;
  const currentDD = c.V[n-1] / 100;
  // GRID
  const principalGrid = c.total_in + c.total_add;
  const subGrid = principalGrid * sub, redGrid = c.total_tp * red;
  const totalGrid = principalGrid + subGrid;
  const curValGrid = c.F[n-1];
  const netGrid = curValGrid + c.total_tp - redGrid - totalGrid;
  const retGrid = totalGrid > 0 ? netGrid/totalGrid : 0;
  const annGrid = totalGrid > 0 ? Math.pow(1+retGrid, 365/days) - 1 : 0;
  const grid = {
    applicable: true,
    principalInvested: principalGrid, totalInvestedWithFee: totalGrid,
    maxPrincipal: c.max_holding_cost, curVal: curValGrid, netProfit: netGrid,
    returnPct: retGrid, ann: annGrid,
    principalReturnPct: principalGrid > 0 ? (curValGrid + c.total_tp - principalGrid)/principalGrid : 0,
    peakReturnPct: c.T[n-1]/100, currentDD,
    tpTotal: c.total_tp, mdd: c.max_strat_dd/100, annVol,
    sharpe: annVol > 0 ? (annGrid - rf)/(annVol/100) : 0,
    purchaseFee: subGrid, redeemFee: redGrid,
    firstNav: navs[0], lastNav: navs[n-1], addTotal: c.total_add,
    tpCount: c.total_tp > 0 ? 1 : 0, days, shares: navs[n-1] > 0 ? curValGrid/navs[n-1] : 0
  };
  // HOLD (bh_F 同现金流含补仓，与 SKILL buy_and_hold 一致)
  const bhF = c.bh_F;
  let _bhc = 0; const bhc = new Array(n);
  for (let i = 0; i < n; i++) { _bhc += c.D[i] + c.N_add[i]; bhc[i] = _bhc; }
  let bhPeakPct = 0; for (let i = 0; i < n; i++) { if (bhc[i] > 0) { const rp = (bhF[i]-bhc[i])/bhc[i]*100; if (rp > bhPeakPct) bhPeakPct = rp; } }
  const bhPk = new Array(n); bhPk[0] = bhF[0];
  for (let i = 1; i < n; i++) { bhPk[i] = Math.max(bhF[i], bhPk[i-1]); }
  let bhMaxDd = 0; for (let i = 0; i < n; i++) { if (bhPk[i] > 0) { const dd = (bhPk[i]-bhF[i])/bhPk[i]*100; if (dd > bhMaxDd) bhMaxDd = dd; } }
  const principalHold = principalGrid, subHold = principalHold*sub;
  const totalHold = principalHold + subHold, curValHold = bhF[n-1];
  const netHold = curValHold - totalHold;
  const retHold = principalHold > 0 ? (curValHold - principalHold*(1+sub))/principalHold : 0;
  const annHold = Math.pow(1+retHold, 365/days) - 1;
  const hold = {
    applicable: true,
    principalInvested: principalHold, totalInvestedWithFee: totalHold,
    maxPrincipal: principalHold, curVal: curValHold, netProfit: netHold,
    returnPct: retHold, ann: annHold,
    principalReturnPct: principalHold > 0 ? (curValHold - principalHold)/principalHold : 0,
    peakReturnPct: bhPeakPct/100, currentDD,
    tpTotal: 0, mdd: bhMaxDd/100, annVol,
    sharpe: annVol > 0 ? (annHold - rf)/(annVol/100) : 0,
    purchaseFee: subHold, redeemFee: 0,
    firstNav: navs[0], lastNav: navs[n-1], addTotal: c.total_add,
    tpCount: 0, days, shares: navs[n-1] > 0 ? curValHold/navs[n-1] : 0
  };
  // PURE DCA (基础额 = 网格累计本金 / 期数，无底仓) —— 仅 DCA 模式适用（lump 类比无意义，与 SKILL 一致）
  const _dcaModes = ["monthly", "weekly", "lumponce_monthly", "lumponce_weekly"];
  let pureDca = { applicable: false, principalInvested:0, totalInvestedWithFee:0, maxPrincipal:0, curVal:0, netProfit:0,
    returnPct:0, ann:0, principalReturnPct:0, peakReturnPct:0, currentDD, tpTotal:0, mdd:0, annVol,
    sharpe:0, purchaseFee:0, redeemFee:0, firstNav:navs[0], lastNav:navs[n-1], addTotal:0, tpCount:0, days, shares:0 };
  if (_dcaModes.includes(mode)) {
    const mask = expandPlan(rows, mode, hasBase ? 1 : 0, (mode === "lump") ? 0 : 1, day, false);
    const num = mask.reduce((a,b)=>a + (b > 0 ? 1 : 0), 0);
    if (num > 0) {
      const basic = c.Q[n-1] / num;
      const pdcaInv = mask.map(m => basic * m);
      const pd = computePureDca(dates, navs, pdcaInv);
      const pTotal = pd.pdca_X[n-1], pSub = pTotal*sub, pTotalIncl = pTotal + pSub;
      const pF = pd.pdca_F[n-1], pNet = pF - pTotalIncl;
      const pRet = pTotalIncl > 0 ? (pF - pTotalIncl)/pTotalIncl : 0;
      const pTotalRet = pTotal > 0 ? (pF - pTotalIncl)/pTotal : 0;
      const pAnn = Math.pow(1 + pTotalRet, 365/days) - 1;
      let pPk = 0; for (let i = 0; i < n; i++) { const s = pd.pdca_X[i] > 0 ? (pd.pdca_F[i]-pd.pdca_X[i])/pd.pdca_X[i]*100 : 0; if (s > pPk) pPk = s; }
      const pPkArr = new Array(n); pPkArr[0] = pd.pdca_F[0];
      for (let i = 1; i < n; i++) { pPkArr[i] = Math.max(pd.pdca_F[i], pPkArr[i-1]); }
      let pMaxDd = 0; for (let i = 0; i < n; i++) { if (pPkArr[i] > 0) { const dd = (pPkArr[i]-pd.pdca_F[i])/pPkArr[i]*100; if (dd > pMaxDd) pMaxDd = dd; } }
      pureDca = { applicable: true, principalInvested: pTotal, totalInvestedWithFee: pTotalIncl, maxPrincipal: pTotal, curVal: pF,
        netProfit: pNet, returnPct: pRet, ann: pAnn, principalReturnPct: pTotal > 0 ? (pF - pTotal)/pTotal : 0,
        peakReturnPct: pPk/100, currentDD, tpTotal: 0, mdd: pMaxDd/100, annVol,
        sharpe: annVol > 0 ? (pAnn - rf)/(annVol/100) : 0, purchaseFee: pSub, redeemFee: 0,
        firstNav: navs[0], lastNav: navs[n-1], addTotal: 0, tpCount: 0, days, shares: navs[n-1] > 0 ? pF/navs[n-1] : 0 };
    }
  }
  return { grid, hold, pureDca };
}

function calcGridImpl(nav){
  const res=document.getElementById("gc-result");
  const code=document.getElementById("gc-code").value.trim();
  const mode=document.getElementById("gc-mode").value;
  const base=Math.max(0,parseFloat(document.getElementById("gc-base").value)||0);
  const dca=Math.max(0,parseFloat(document.getElementById("gc-dca").value)||0);
  let start=document.getElementById("gc-start").value, end=document.getElementById("gc-end").value;
  const dataFirst=nav.data[0][0], dataLast=nav.data[nav.data.length-1][0];
  const userStart=start, userEnd=end;
  if(!start) start=dataFirst;
  if(!end) end=dataLast;
  const day=Math.min(28,Math.max(1,parseInt(document.getElementById("gc-day").value)||1));
  let rows=nav.data.filter(p=>(!start||p[0]>=start)&&(!end||p[0]<=end));
  if(rows.length<2){ res.innerHTML='<div class="muted" style="padding:10px">区间内净值数据不足（需≥2个交易日）</div>'; return; }
  const actualStart=rows[0][0], actualEnd=rows[rows.length-1][0];
  const clamped = (userStart && userStart<dataFirst) || (userEnd && userEnd>dataLast);

  const bt = runBacktest(rows, mode, base, dca, day);
  const grid = bt.grid, hold = bt.hold, pure = bt.pureDca;

  const fmt=fmtMoney, fp=fmtPct;
  const col=x=>x>=0?"var(--danger)":"var(--success)";
  const warn=clamped?'<div style="margin:10px 0;padding:8px 10px;background:#fff7e6;border-radius:8px;color:#b45d06;font-size:13px"><b>日期已自动截断：</b>你选择的是 '+esc(userStart||dataFirst)+' 至 '+esc(userEnd||dataLast)+'，但 '+esc(nav.name||code)+' 的净值数据仅覆盖 '+dataFirst+' 至 '+dataLast+'，实际回测区间为 '+actualStart+' 至 '+actualEnd+'。</div>':'';

  const row=(label, vals, remark="", opts={})=>{
    const [g,h,p]=vals;
    const isNum=opts.num!==false;
    return `<tr style="border-bottom:1px solid #e8ecf1"><td style="padding:8px 10px;font-weight:600;color:#4a5568;background:#f7fafc;width:110px">${label}</td>`+
      `<td style="padding:8px 10px;text-align:right;color:${isNum?col(g):'inherit'}">${g}</td>`+
      `<td style="padding:8px 10px;text-align:right;color:${isNum?col(h):'inherit'}">${h}</td>`+
      `<td style="padding:8px 10px;text-align:right;color:${isNum?col(p):'inherit'}">${p}</td>`+
      `<td style="padding:8px 10px;color:#718096;font-size:12px">${remark}</td></tr>`;
  };
  const sec=(title)=>`<tr><td colspan="5" style="padding:6px 10px;background:#e6eef7;color:#1a4a7a;font-weight:700;font-size:13px">${title}</td></tr>`;

  const tableHtml=`<div style="overflow-x:auto;margin-top:12px;border-radius:10px;border:1px solid #d0d7de">
  <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:640px;background:#fff">
    <thead><tr style="background:#1e4e79;color:#fff">
      <th style="padding:10px;text-align:left;font-weight:700">指标</th>
      <th style="padding:10px;text-align:right;font-weight:700">网格-落袋</th>
      <th style="padding:10px;text-align:right;font-weight:700">持有-不卖</th>
      <th style="padding:10px;text-align:right;font-weight:700">纯定投-无底仓</th>
      <th style="padding:10px;text-align:left;font-weight:700">备注</th>
    </tr></thead>
    <tbody>
      ${sec("投入与市值")}
      ${row("总投入(含费用)", [fmt(grid.totalInvestedWithFee), fmt(hold.totalInvestedWithFee), fmt(pure.totalInvestedWithFee)], "申购费0.15%+赎回费0.5%", {num:false})}
      ${row("累计本金(不含费)", [fmt(grid.principalInvested), fmt(hold.principalInvested), fmt(pure.principalInvested)], "实际净申购金额", {num:false})}
      ${row("当前市值", [fmt(grid.curVal), fmt(hold.curVal), fmt(pure.curVal)], "剩余份额×最新净值", {num:false})}
      ${row("最大持仓成本", [fmt(grid.maxPrincipal), fmt(hold.maxPrincipal), fmt(pure.maxPrincipal)], "本金投入峰值", {num:false})}
      ${sec("收益")}
      ${row("净收益", [fmt(grid.netProfit), fmt(hold.netProfit), fmt(pure.netProfit)], "市值+止盈-总投入")}
      ${row("总回报率%(费后)", [fp(grid.returnPct), fp(hold.returnPct), fp(pure.returnPct)], "净收益/总投入")}
      ${row("年化收益率%", [fp(grid.ann), fp(hold.ann), fp(pure.ann)], "复利年化")}
      ${row("总收益率%(本金口径)", [fp(grid.principalReturnPct), fp(hold.principalReturnPct), fp(pure.principalReturnPct)], "(市值+止盈-本金)/本金")}
      ${row("收益峰值%", [fp(grid.peakReturnPct), fp(hold.peakReturnPct), fp(pure.peakReturnPct)], "历史最高收益率")}
      ${row("当前回撤%", [fp(grid.currentDD), fp(hold.currentDD), fp(pure.currentDD)], "自收益峰值回撤", {num:false})}
      ${sec("风险")}
      ${row("累计已实现止盈(毛)", [fmt(grid.tpTotal), fmt(hold.tpTotal), fmt(pure.tpTotal)], "网格减仓落袋金额", {num:false})}
      ${row("最大回撤%", [fp(grid.mdd), fp(hold.mdd), fp(pure.mdd)], "权益曲线最大回撤")}
      ${row("年化波动%", [fp(grid.annVol), fp(hold.annVol), fp(pure.annVol)], "日收益年化标准差")}
      ${row("夏普", [grid.sharpe.toFixed(2), hold.sharpe.toFixed(2), pure.sharpe.toFixed(2)], "(年化-2.5%无风险)/波动", {num:false})}
      ${sec("费用")}
      ${row("申购费", [fmt(grid.purchaseFee), fmt(hold.purchaseFee), fmt(pure.purchaseFee)], "本金×0.15%", {num:false})}
      ${row("赎回费", [fmt(grid.redeemFee), fmt(hold.redeemFee), fmt(pure.redeemFee)], "止盈×0.5%", {num:false})}
      ${row("复投摩擦费", ["¥0.00", "¥0.00", "¥0.00"], "暂未计入", {num:false})}
      ${sec("最新信号快照")}
      ${row("最新净值", [grid.lastNav.toFixed(4), hold.lastNav.toFixed(4), pure.lastNav.toFixed(4)], nav.name||code, {num:false})}
      ${row("建仓起累计涨幅%", [fp(grid.lastNav/grid.firstNav-1), fp(hold.lastNav/hold.firstNav-1), fp(pure.lastNav/pure.firstNav-1)], "区间起点→终点")}
      ${row("止盈金额", [fmt(grid.tpTotal), "¥0.00", "¥0.00"], "网格策略卖出所得", {num:false})}
      ${row("补仓金额", [fmt(grid.addTotal), "¥0.00", "¥0.00"], "网格策略追加投入", {num:false})}
    </tbody>
  </table></div>`;

  res.innerHTML=warn+tableHtml+
    '<div class="hint" style="margin-top:10px">实际回测区间：'+actualStart+' 至 '+actualEnd+' ｜ '+rows.length+' 个交易日 ｜ 净值来源：'+(nav.src==="synced"?"页面已同步真实数据 · "+esc(nav.name):(nav.src==="online"?"天天基金在线拉取 · "+esc(nav.name):"粘贴序列"))+' ｜ 引擎：grid-investment-tracker SKILL v2.0.11 同款算法（M补仓成本/峰值双阶段 + dca倍投 + I止盈 + 封顶）；网格=I止盈+成本回撤补仓；持有=同计划买入持有；纯定投=仅定投无底仓</div>';
}
function gcToggleFields(){
  const mode=document.getElementById("gc-mode")?.value||"lumponce_monthly";
  const baseWrap=document.getElementById("gc-base-wrap");
  const dcaWrap=document.getElementById("gc-dca-wrap");
  const dayWrap=document.getElementById("gc-day-wrap");
  if(!baseWrap || !dcaWrap || !dayWrap) return;
  const hasBase = mode.startsWith("lumponce") || mode==="lump";
  const hasDca  = mode!=="lump";
  baseWrap.style.display = hasBase ? "" : "none";
  dcaWrap.style.display  = hasDca  ? "" : "none";
  // 安全取 label：优先 div>label，兜底首个子元素
  const lb = dayWrap.querySelector("label") || dayWrap.firstElementChild;
  if(lb) lb.textContent = mode.startsWith("weekly") ? "定投频率(每N个交易日)" : "定投日(每月)";
}

/* ============== Events ============== */
function bindEvents(){
  // nav
  document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>render(b.dataset.view)));
  // input binding (delegated)
  document.querySelector(".content").addEventListener("change",onFieldChange);
  document.querySelector(".content").addEventListener("input",onFieldInput);
  // clicks (add/del/buttons)
  document.querySelector(".content").addEventListener("click",onContentClick);
  // topbar
  document.getElementById("btnLang").addEventListener("click",()=>setLang(lang==="zh"?"en":"zh"));
  document.getElementById("btnTheme").addEventListener("click",()=>setTheme(getTheme()==="light"?"dark":"light"));
  document.getElementById("btnExport").addEventListener("click",exportBackup);
  document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change",importBackup);
  document.getElementById("btnClear").addEventListener("click",confirmClear);
  // modal
  document.getElementById("modalMask").addEventListener("click",e=>{ if(e.target.id==="modalMask") closeModal(); });
}

function onFieldInput(e){
  const el=e.target;
  if(el && el.id==="gc-code"){ gcPrefill(); }
}
function updateHealthHeader(){
  const alloc=computeAllocation();
  const cards=document.querySelectorAll('#view-dashboard .card');
  cards.forEach(c=>{ const h3=c.querySelector('h3'); if(h3 && h3.textContent.includes(t('dashHealth'))){ const tg=h3.querySelector('.tag'); if(tg) tg.textContent='国内 '+alloc.domPct+'%'; } });
}
function onFieldChange(e){
  const el=e.target;
  if(el && el.id==="gc-mode"){ gcToggleFields(); }
  // 同步行备注：按基金代码存入备注表（不污染同步源）
  if(el.dataset.noteCode){
    const code=el.dataset.noteCode; const notes=loadNotes(); notes[code]=el.value; saveNotes(notes);
    const row=state.holdings.find(x=>x.code===code); if(row) row.note=el.value;
    return;
  }
  if(!el.dataset.bind) return;
  const b=el.dataset.bind, i=+el.dataset.i, k=el.dataset.k, f=el.dataset.f, g=el.dataset.g;
  if(b==="custom"){
    const row=state.holdings[i]; if(!row) return;
    let val=el.value; if(el.type==="number") val=parseFloat(val)||0;
    row[f]=val; saveCustom(state.holdings.filter(x=>!x.synced)); save(); return;
  }
  if(b==="indices"||b==="funds"||b==="tools"||b==="netWorth"){
    const idx=i; if(!state[b][idx]) return;
    let val=el.value; if(el.type==="number") val=parseFloat(val)||0;
    state[b][idx][f]=val;
  } else if(b==="macro"){
    const it=state.macro[g].find(x=>x.key===k); if(it) it.value=el.value;
  } else if(b==="sentiment"){
    const s=state.sentiment.find(x=>x.key===k); if(s) s.value=el.value;
  }
  save(); renderActive();
}
function onContentClick(e){
  const calcBtn=e.target.closest('[data-action="calcGrid"]');
  if(calcBtn){ calcGrid(); return; }
  const infoBtn=e.target.closest("[data-info-toggle]");
  if(infoBtn){ const card=infoBtn.closest(".ind-card"); if(card){ const open=card.classList.toggle("open"); infoBtn.setAttribute("aria-expanded", open?"true":"false"); } return; }
  const tgt=e.target.closest("[data-del],[data-add],[data-foc],[data-delfoc],[id]");
  if(!tgt) return;
  if(tgt.dataset.del){ const b=tgt.dataset.del,i=+tgt.dataset.i;
    if(b==="custom"){ state.holdings.splice(i,1); saveCustom(state.holdings.filter(x=>!x.synced)); save(); renderActive(); toast(t('toastDeleted')); return; }
    if(state[b]){ state[b].splice(i,1); save(); renderActive(); toast(t('toastDeleted')); } return; }
  if(tgt.dataset.toggleEdit!==undefined){ const i=+tgt.dataset.toggleEdit, el=document.getElementById("idx-edit-"+i); if(el){ const vis=el.style.display!=="none"; el.style.display=vis?"none":"block"; } return; }
  if(tgt.dataset.toggleEditFund!==undefined){ const i=+tgt.dataset.toggleEditFund, el=document.getElementById("fund-edit-"+i); if(el){ const vis=el.style.display!=="none"; el.style.display=vis?"none":"block"; } return; }
  if(tgt.dataset.add){ const b=tgt.dataset.add; addItem(b); return; }
  if(tgt.dataset.foc!==undefined){ const i=+tgt.dataset.foc; state.focus[i].done=!state.focus[i].done; save(); renderActive(); return; }
  if(tgt.dataset.delfoc!==undefined){ const i=+tgt.dataset.delfoc; state.focus.splice(i,1); save(); renderActive(); return; }
  if(tgt.id==="addFocus"){ const inp=document.getElementById("focusInput"); const v=inp.value.trim(); if(v){ state.focus.unshift({text:v,done:false,source:"manual",createdAt:new Date().toISOString().slice(0,10)}); inp.value=""; save(); renderActive(); toast(t('toastAdded')); } return; }
  if(tgt.dataset.clearfoc!==undefined){ if(confirm("确定清空所有待办事项？此操作不可撤销。")){ state.focus=[]; save(); renderActive(); toast(t('toastDeleted')); } return; }
  if(tgt.dataset.newscat!==undefined){ newsFilter=tgt.dataset.newscat; renderActive(); return; }
  if(tgt.id==="holdAdd"){ const custom=loadCustom(); custom.push({name:"",code:"",cost:0,market:0,note:""}); saveCustom(custom); state.holdings=buildHoldings(); renderActive(); toast(t('toastAdded')); return; }
  if(tgt.id==="holdSync"){ syncHoldings(); syncNews(); syncSentiment(); syncMacro(); return; }
  if(tgt.id==="holdCsv"){ exportCsv(); return; }
}
// 同步持仓：部署版 fetch holdings-data.json；本地版从内嵌同步源重载
function syncHoldings(){
  const btn=document.getElementById("holdSync"); if(btn) btn.disabled=true;
  if(location.protocol!=="file:"){
    fetch("./holdings-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(j=>{ if(j&&j.holdings){ MEM_SYNCED=j.holdings; MEM_SYNCED_AT=j.syncedAt||new Date().toISOString();
        state.holdings=buildHoldings(); save(); renderActive(); toast("持仓已重载 ✓（本机 ttskill 同步快照）"); } })
      .catch(()=>{ toast(t('holdNoSync')); })
      .finally(()=>{ if(btn) btn.disabled=false; });
  } else {
    state.holdings=buildHoldings(); save(); renderActive(); toast("持仓已重载 ✓（本机同步快照 "+fmtSync(syncedAtStr())+"）");
    if(btn) btn.disabled=false;
  }
}
// 同步自动源要闻：
//  - 本地(file://)与线上基线：读取内联 SYNCED_NEWS（每日自动化注入，不受 file:// 无法 fetch 的限制）
//  - 部署版(http)：再 fetch news-data.json（每日自动化推送）拿最新覆盖，保证线上永远最新
function applyAutoNews(j){
  if(j && Array.isArray(j.news)){ AUTO_NEWS=j.news; NEWS_UPDATED_AT=j.updatedAt||""; renderActive(); }
}
function syncNews(){
  if(typeof SYNCED_NEWS!=="undefined" && SYNCED_NEWS && SYNCED_NEWS.length){
    applyAutoNews({ updatedAt:(typeof SYNCED_NEWS_AT!=="undefined"?SYNCED_NEWS_AT:""), news:SYNCED_NEWS });
  }
  if(location.protocol!=="file:"){
    fetch("./news-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(applyAutoNews)
      .catch(()=>{});
  }
}
// 同步市场情绪曲线：部署版 fetch sentiment-data.json 覆盖内联 SYNCED_BUFFETT/SYNCED_FNG
function syncSentiment(){
  if(location.protocol!=="file:"){
    fetch("./sentiment-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(j=>{ if(j&&Array.isArray(j.buffett)) MEM_BUFFETT=j.buffett; if(j&&Array.isArray(j.fng)) MEM_FNG=j.fng; renderActive(); })
      .catch(()=>{});
  }
}
// 同步宏观真实指标：部署版 fetch macro-data.json 覆盖内联 SYNCED_MACRO
function syncMacro(){
  if(location.protocol!=="file:"){
    fetch("./macro-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(j=>{ if(j&&(j.money||j.pc)) MEM_MACRO=j; renderActive(); })
      .catch(()=>{});
  }
}
// 同步动量/市场情绪曲线：部署版 fetch momentum-data.json 覆盖内联 SYNCED_MOMENTUM
function syncMomentum(){
  if(location.protocol!=="file:"){
    fetch("./momentum-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(j=>{ if(j&&j.indicators){ MEM_MOMENTUM=j; renderActive(); } })
      .catch(()=>{});
  }
}
// 取宏观指标的真实映射（内联 SYNCED_MACRO 优先，部署版 fetch 覆盖其次）
function getMacroReal(){
  const base = (typeof SYNCED_MACRO!=="undefined" && SYNCED_MACRO) ? SYNCED_MACRO : null;
  const src = MEM_MACRO || base;
  const map = {};
  if(src){ (src.money||[]).concat(src.pc||[],src.momentum||[]).forEach(x=>{ map[x.key]={value:x.value,date:x.date,source:MACRO_SOURCE[x.key]||""}; }); }
  return map;
}
function addItem(b){
  if(b==="netWorth"){ const last=state.netWorth[state.netWorth.length-1]; const nd=last?incDay(last.d):todayStr(); state.netWorth.push({d:nd, v:last?last.v:100}); }
  else if(b==="indices"){ state.indices.push({code:"",name:"",pe:0,pb:0,pct:0,peSeries:""}); }
  else if(b==="funds"){ state.funds.push({code:"",name:"",nav:"",bench:"",benchName:"沪深300"}); }
  else if(b==="tools"){ state.tools.push({name:"新工具",desc:"",note:""}); }
  save(); renderActive(); toast(t('toastAdded'));
}
function incMonth(ym){ const [y,m]=ym.split("-").map(Number); const nm=m===12?1:m+1; const ny=m===12?y+1:y; return ny+"-"+String(nm).padStart(2,"0"); }
function incDay(dstr){ const d=new Date(dstr+"T00:00:00"); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* ============== Export / Import / Clear ============== */
function exportBackup(){
  const data={ _app:"投资管理工作台", _ver:1, _exported:new Date().toISOString(),
    theme:getTheme(), lang:lang, data:state };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="投资工作台备份_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast(t('exportOk'));
}
function importBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const obj=JSON.parse(rd.result);
    let data = obj.data ? obj.data : obj;
    state = (typeof data==="object" && !Array.isArray(data)) ? data : defaultState();
    if(obj.theme) setTheme(obj.theme); if(obj.lang) setLang(obj.lang);
    // 持仓：同步项由 ttskill 主导，仅保留导入中的自定义行与备注
    const imp = (state.holdings||[]);
    saveCustom(imp.filter(x=>x.synced===false).map(x=>({name:x.name,code:x.code,cost:x.cost,market:x.market,note:x.note})));
    const notes=loadNotes(); imp.forEach(x=>{ if(x.note && x.code) notes[x.code]=x.note; }); saveNotes(notes);
    state.holdings = buildHoldings();
    persist(state);
    renderActive(); applyStaticI18n(); toast(t('importOk'));
  }catch(err){ toast(t('importFail')); } };
  rd.readAsText(file); e.target.value="";
}
function exportCsv(){
  const rows=[["名称","代码","成本","市值","浮动盈亏","收益率","备注"]];
  state.holdings.forEach(b=>{ const c=+b.cost||0,m=+b.market||0,p=m-c,r=c>0?(p/c*100):0;
    rows.push([b.name,b.code,c,m,p.toFixed(0),r.toFixed(1)+"%",b.note]); });
  const csv="\uFEFF"+rows.map(r=>r.map(x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="持仓导出.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function confirmClear(){
  openModal(`<h3>${t('clearTitle')}</h3><p>${t('clearMsg')}</p>
    <div class="actions"><button class="mini-btn" data-close>${t('cancel')}</button>
    <button class="mini-btn danger" id="doClear" style="border-color:var(--danger);color:var(--danger)">${t('clearConfirm')}</button></div>`);
  document.getElementById("doClear").addEventListener("click",()=>{
    localStorage.removeItem(LS_MAIN); state=defaultState(); persist(state); renderActive(); closeModal(); toast(t('toastDeleted'));
  });
}

/* ============== Modal / Add-to-home ============== */
function openModal(html){ const box=document.getElementById("modalBox"); box.innerHTML=html; document.getElementById("modalMask").classList.add("show");
  box.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal)); }
function closeModal(){ document.getElementById("modalMask").classList.remove("show"); }
function showAddHome(){
  openModal(`<h3>${t('addHomeTitle')}</h3><p>${t('addHomeMsg')}</p>
    <div class="steps"><div>1. ${t('addHomeIos')}</div><div>2. ${t('addHomeAndroid')}</div></div>
    <p style="margin-top:10px">${t('addHomeNote')}</p>
    <div class="actions"><button class="mini-btn primary" style="background:var(--primary);color:#fff" data-close>${t('close')}</button></div>`);
}

/* ============== Init ============== */
function init(){
  initLang();
  setTheme(getTheme());
  document.getElementById("langLabel").textContent = (lang==="zh")?"EN":"中";
  applyStaticI18n();
  bindEvents();
  render("dashboard");
  if(location.protocol!=="file:"){ syncHoldings(); syncNews(); syncSentiment(); syncMacro(); syncMomentum(); checkVersion(); }   // 部署版：打开即拉取最新持仓 + 自动源要闻 + 情绪曲线 + 宏观指标 + 动量曲线 + 版本检测
  // long-press / dblclick brand to show add-home hint? add a small entry: press logo 2s
  document.querySelector(".brand .logo").addEventListener("click",showAddHome);
}
// 版本检测：远程 version.json 版本号高于内置 APP_VER → 弹横幅提示刷新（防旧版 HTML 缓存误导）
function checkVersion(){
  if(typeof APP_VER==="undefined") return;
  fetch("version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(j && j.v && j.v!==APP_VER){
      const seen = localStorage.getItem("wb_appver_seen");
      if(seen && seen===j.v) return; // 已对该版本点过刷新/关闭，不再循环打扰
      const b=document.getElementById("verBanner");
      document.getElementById("vbNew").textContent=j.v;
      document.getElementById("vbCur").textContent=APP_VER;
      b.classList.add("show");
    }
  }).catch(()=>{});
}
function doVersionRefresh(){
  const newVer = document.getElementById("vbNew").textContent;
  try{ localStorage.setItem("wb_appver_seen", newVer || APP_VER); }catch(e){}
  location.reload(true);
}
(function(){
  const b=document.getElementById("verBanner"); if(!b) return;
  b.addEventListener("click",(e)=>{ if(e.target && e.target.id==="vbX"){ b.classList.remove("show"); } else { doVersionRefresh(); } });
})();
init();
</script>
