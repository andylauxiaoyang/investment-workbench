<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16a34a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316a34a'/%3E%3Cpath d='M20 34 L29 43 L45 24' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E6%8A%95%E8%B5%84%E7%AE%A1%E7%90%86%E5%B7%A5%E4%BD%9C%E5%8F%B0%22%2C%22short_name%22%3A%22%E6%8A%95%E8%B5%84%E5%8F%B0%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f7f5%22%2C%22theme_color%22%3A%22%2316a34a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D'http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%253D'0%25200%252064%252064'%253E%253Crect%2520width%253D'64'%2520height%253D'64'%2520rx%253D'14'%2520fill%253D'%252316a34a'%252F%253E%253Cpath%2520d%253D'M20%253034%2520L29%253043%2520L45%253024'%2520stroke%253D'white'%2520stroke-width%253D'6'%2520fill%253D'none'%2520stroke-linecap%253D'round'%2520stroke-linejoin%253D'round'%252F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%2264x64%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<title>投资管理工作台</title>
<style>
:root[data-theme="light"]{
  --bg:#eef3ef; --panel:#ffffff; --panel2:#f6faf7; --text:#15241c; --muted:#5f7268;
  --primary:#15a34a; --primary-d:#0e7d38; --primary-weak:#d8f3e2; --primary-weak2:#eafaf1;
  --border:#e1e9e4; --shadow:0 4px 18px rgba(20,60,40,.07); --danger:#d83a3a; --warn:#d99100;
  --success:#15a34a; --info:#2b7de9; --grid:#eef2ef; --track:#e7eee9;
}
:root[data-theme="dark"]{
  --bg:#0d1411; --panel:#15201a; --panel2:#1a2620; --text:#e7f0ea; --muted:#8ba296;
  --primary:#28c46a; --primary-d:#1f9e54; --primary-weak:#13331f; --primary-weak2:#163a23;
  --border:#26342c; --shadow:0 6px 22px rgba(0,0,0,.45); --danger:#f06a6a; --warn:#f3b53e;
  --success:#28c46a; --info:#5aa0f2; --grid:#1d2a23; --track:#243229;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
  line-height:1.5; font-size:15px;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--primary-d)}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.brand .name{font-weight:700;font-size:16px;line-height:1.2}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:var(--muted);
  font-size:14.5px;font-weight:600;border:none;background:transparent;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item svg{width:20px;height:20px;flex:0 0 20px}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary-d)}
.sidebar .spacer{flex:1}
.side-foot{font-size:11px;color:var(--muted);padding:8px;text-align:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:120px}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel2);
  color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;min-height:40px;
}
.tbtn:hover{border-color:var(--primary);color:var(--primary-d)}
.tbtn svg{width:17px;height:17px}
.tbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn.primary:hover{background:var(--primary-d);color:#fff}

.content{padding:20px;padding-bottom:40px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards / grid */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:600;color:var(--primary-d);background:var(--primary-weak);
  padding:2px 8px;border-radius:20px}
.card .hint{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .delta{font-size:13px;font-weight:700}
.up{color:var(--success)} .down{color:var(--danger)}
.muted{color:var(--muted)}
.tag.auto{font-size:10px;font-weight:700;color:var(--primary-d);background:var(--primary-weak);padding:1px 6px;border-radius:6px;vertical-align:middle}
.sync-bar{font-size:12px;margin:-4px 0 10px;padding:7px 10px;border:1px dashed var(--border);border-radius:8px;background:var(--panel2)}
tr.synced td:first-child{font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.right{margin-left:auto}
.section-title{font-size:18px;font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:8px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
td input,td select{border:1px solid var(--border);background:var(--panel2);color:var(--text);
  border-radius:8px;padding:7px 8px;width:100%;font-size:14px}
td input:focus,td select:focus{outline:none;border-color:var(--primary)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mini-btn{border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:6px 10px;
  font-size:13px;color:var(--text);min-height:36px}
.mini-btn:hover{border-color:var(--primary);color:var(--primary-d)}
.mini-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.icon-btn{border:none;background:transparent;color:var(--muted);padding:6px;border-radius:8px;min-height:36px;min-width:36px}
.icon-btn:hover{background:var(--panel2);color:var(--danger)}

/* progress bar */
.pbar{height:10px;border-radius:20px;background:var(--track);overflow:hidden;margin:6px 0}
.pbar > i{display:block;height:100%;border-radius:20px;background:var(--primary);transition:width .4s}
.health-row{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.health-row .top{display:flex;justify-content:space-between;font-size:13.5px}
.health-row .top b{font-variant-numeric:tabular-nums}

/* focus list */
.focus-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);
  border-radius:12px;margin-bottom:10px;background:var(--panel2)}
.focus-item.done{opacity:.55}
.focus-item .txt{flex:1;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.focus-item .txt s{color:var(--muted)}
.focus-item .due{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);padding:1px 7px;border-radius:10px;font-variant-numeric:tabular-nums}
.focus-item .due.over{color:#fff;background:#e5484d;border-color:#e5484d}

/* 财经要闻 */
.news-list{max-height:380px;overflow-y:auto;margin:-2px 0 2px}
.news-item{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-star{flex:0 0 auto;background:transparent;border:none;padding:2px;color:var(--muted);min-width:30px;min-height:30px;cursor:pointer}
.news-star:hover{color:#f5a623}
.news-star.on{color:#f5a623}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;font-weight:600;line-height:1.45;color:var(--text);text-decoration:none;display:inline-block;word-break:break-word}
.news-title:hover{text-decoration:underline;color:var(--primary-d)}
.news-title.imp{color:var(--primary-d)}
.news-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news-meta .src{color:var(--primary);font-weight:600}
.news-meta .imp-tag{color:#b26a00;background:rgba(245,166,35,.16);padding:1px 7px;border-radius:10px}
.news-add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.news-add input,.news-add select{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 11px;font-size:13.5px;width:100%}
.news-add input:focus,.news-add select:focus{outline:none;border-color:var(--primary)}
.news-add .full{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.news-add label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.news-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.news-chip{font-size:12px;padding:3px 11px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;transition:.15s}
.news-chip:hover{border-color:var(--primary)}
.news-chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.news-cat{font-size:11px;font-weight:600;color:var(--primary-d);background:var(--primary-weak);padding:1px 7px;border-radius:10px}
.news-imp{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px}
.news-imp.up{color:#0e7d38;background:#d8f3e2}
.news-imp.down{color:#c0341f;background:#fbe3e3}
.news-imp.neutral{color:#5f7268;background:#eef1f5}
.news-date-h{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.news-date-h::after{content:'';flex:1;height:1px;background:var(--border)}
@media(max-width:768px){ .news-add{grid-template-columns:1fr 1fr} }
.tag.auto{color:#8a5a00;background:#fff3d6}
.tag.warn{color:#8a5a00;background:#fff3d6}

/* gauge wrap */
.gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gauge-card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.gauge-card .gv{font-size:22px;font-weight:800;margin-top:-6px}
.gauge-card .gl{font-size:12.5px;color:var(--muted);margin-top:2px}
.gauge-card .gz{font-size:11.5px;font-weight:700;margin-top:4px}

/* indicator grid */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ind-card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px}
.ind-card .il{font-size:12.5px;color:var(--muted);min-height:34px}
.ind-card .iv{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.ind-card input{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;
  padding:7px 8px;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.ind-card .iu{font-size:12px;color:var(--muted)}
.ind-card .in{font-size:11.5px;color:var(--muted);margin-top:6px}
.cat-title{font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.4px}

/* funnel */
.funnel-stage{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.funnel-bar{height:42px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px;transition:width .4s;min-width:60px}
.funnel-meta{font-size:13px;color:var(--muted);white-space:nowrap}
.funnel-meta b{color:var(--text);font-size:15px}

/* list cards (funds/companies/tools) */
.item-card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.item-card .ic-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.item-card .ic-title{font-weight:700;font-size:15px;flex:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fgrid input,.fgrid select,.fgrid textarea{border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:8px;padding:8px;width:100%;font-size:14px}
.fgrid textarea{min-height:60px;resize:vertical}
.funnel-tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.funnel-tool input{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;
  padding:7px 8px;font-size:14px}
.funnel-tool input.v{width:90px;text-align:right}

/* toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#15241c;
  color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
  justify-content:center;z-index:80;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;max-width:440px;width:100%;
  padding:22px;box-shadow:var(--shadow);max-height:85vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal p{font-size:14px;color:var(--muted);line-height:1.6}
.modal .steps{font-size:14px;line-height:1.9;padding-left:18px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* bottom tab (mobile) */
.bottom-tab{display:none}
@media(max-width:820px){
  .sidebar{display:none}
  .bottom-tab{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--border);z-index:30;overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-tab .nav-item{flex:1 1 0;flex-direction:column;gap:2px;padding:7px 1px;border-radius:0;font-size:10px;min-width:0;
    justify-content:center;min-height:54px;overflow:hidden;text-align:center}
  .bottom-tab .nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
  .bottom-tab .nav-item svg{width:20px;height:20px}
  .content{padding:14px;padding-bottom:84px}
  .topbar{padding:10px 14px}
  .topbar h1{font-size:15px}
  .tbtn{padding:7px 10px;font-size:12px}
  .cols-2,.cols-3,.cols-4{grid-template-columns:1fr}
  .kpi .val{font-size:22px}
}
@media(min-width:821px){ .bottom-tab{display:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">投</div>
      <div>
        <div class="name" data-i18n="appName">投资管理工作台</div>
        <div class="sub" data-i18n="appSub">Investment Workbench</div>
      </div>
    </div>
    <button class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-i18n="nav.dashboard">概览</span></button>
    <button class="nav-item" data-view="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M3 10h12M3 15h18M3 20h12"/></svg><span data-i18n="nav.news">财经要闻</span></button>
    <button class="nav-item" data-view="holdings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/><circle cx="7" cy="7" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="17" cy="17" r="1.4" fill="currentColor"/></svg><span data-i18n="nav.holdings">我的持仓</span></button>
    <button class="nav-item" data-view="macro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 3 8-8"/><path d="M21 7v5h-5"/></svg><span data-i18n="nav.macro">宏观 & 市场</span></button>
    <button class="nav-item" data-view="research"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span data-i18n="nav.research">基金 & 公司</span></button>
    <button class="nav-item" data-view="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 7l3 3-9 9-3 1 1-3z"/><path d="M14 4l6 6"/></svg><span data-i18n="nav.tools">工具方法</span></button>
    <div class="spacer"></div>
    <div class="side-foot" data-i18n="sideFoot">本地存储 · 离线可用</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 data-i18n="appName">投资管理工作台</h1>
      <button class="tbtn" id="btnLang" title="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg><span id="langLabel">EN</span></button>
      <button class="tbtn" id="btnTheme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></button>
      <button class="tbtn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 19h16"/></svg><span data-i18n="btn.export">导出备份</span></button>
      <button class="tbtn" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M4 19h16"/></svg><span data-i18n="btn.import">导入恢复</span></button>
      <button class="tbtn danger" id="btnClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-i18n="btn.clear">清空</span></button>
      <input type="file" id="fileInput" accept="application/json" style="display:none">
    </div>
    <div class="content">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-news"></section>
      <section class="view" id="view-holdings"></section>
      <section class="view" id="view-macro"></section>
      <section class="view" id="view-research"></section>
      <section class="view" id="view-tools"></section>

/* ============== Charts (inline SVG) ============== */
function svgLine(data){
  const w=560,h=240,pl=44,pr=14,pt=18,pb=30;
  const iw=w-pl-pr, ih=h-pt-pb;
  if(!data||data.length<2) return '<div class="muted" style="padding:30px;text-align:center">'+t('noData')+'</div>';
  const vals=data.map(d=>parseFloat(d.v)); let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){mn-=5;mx+=5;}
  const padR=(mx-mn)*0.12; mn-=padR; mx+=padR;
  const X=i=>pl+(iw*i/(data.length-1));
  const Y=v=>pt+ih-( (v-mn)/(mx-mn) )*ih;
  let g="";
  for(let s=0;s<=4;s++){ const yy=pt+ih*s/4; const vv=(mx-(mx-mn)*s/4); g+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${vv.toFixed(0)}</text>`; }
  let pts=data.map((d,i)=>`${X(i).toFixed(1)},${Y(parseFloat(d.v)).toFixed(1)}`).join(" ");
  let area=`${pl},${pt+ih} `+pts+` ${w-pr},${pt+ih}`;
  let dots="",labels="";
  data.forEach((d,i)=>{ if(i%Math.ceil(data.length/7)===0||i===data.length-1){ labels+=`<text x="${X(i)}" y="${h-10}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.m}</text>`; }
    dots+=`<circle cx="${X(i)}" cy="${Y(parseFloat(d.v))}" r="3" fill="var(--primary)"/>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
    ${g}
    <polygon points="${area}" fill="url(#lg)"/>
    <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function svgFunnel(stages){
  if(!stages||!stages.length) return '<div class="muted" style="padding:20px;text-align:center">'+t('noData')+'</div>';
  const max=Math.max(...stages.map(s=>parseFloat(s.value)||0),1);
  const W=520, gap=10, n=stages.length;
  const bh=Math.floor((260-(n-1)*gap)/n);
  let svg=`<svg viewBox="0 0 ${W} 260" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">`;
  const colors=["#15a34a","#1f9e54","#34b36a","#5cc488","#86d4a8"];
  let prevR=null;
  stages.forEach((s,i)=>{
    const val=parseFloat(s.value)||0;
    const wTop=(val/max)*W;
    const nextVal=i<n-1?(parseFloat(stages[i+1].value)||0):0;
    const wBot=(nextVal/max)*W;
    const y=i*(bh+gap);
    const cx=W/2;
    const x1=cx-wTop/2, x2=cx+wTop/2, x3=cx+wBot/2, x4=cx-wBot/2;
    const c=colors[i%colors.length];
    const lbl=(lang==="zh"? (s.zh||s.label) : (s.en||s.label)) ;
    svg+=`<polygon points="${x1},${y} ${x2},${y} ${x3},${y+bh} ${x4},${y+bh}" fill="${c}" opacity="0.92"/>`;
    svg+=`<text x="${cx}" y="${y+bh/2+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${lbl} · ${val}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}
function svgGauge(value,min,max,zones){
  const v=Math.max(min,Math.min(max,parseFloat(value)||0));
  const pct=(v-min)/(max-min);
  const cx=90,cy=90,r=72;
  const a0=Math.PI, a1=0; // 180deg top semicircle
  const ang=a0+(a1-a0)*pct;
  const x1=cx+Math.cos(a0)*r, y1=cy-Math.sin(a0)*r;
  const x2=cx+Math.cos(a1)*r, y2=cy-Math.sin(a1)*r;
  const nx=cx+Math.cos(ang)*r, ny=cy-Math.sin(ang)*r;
  let zoneColor=zones[zones.length-1].color;
  for(const z of zones){ if(pct<=z.max){ zoneColor=z.color; break; } }
  let zl=""; for(const z of zones){ if(pct<=z.max){ zl=z.label; break; } }
  // background arc (over the top: sweep-flag 0)
  const bpath=`M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 0 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  // value arc (sweep from a0 to ang over the top)
  const vx=cx+Math.cos(ang)*r, vy=cy-Math.sin(ang)*r;
  const vpath=`M ${(cx+Math.cos(a0)*r).toFixed(1)} ${(cy-Math.sin(a0)*r).toFixed(1)} A ${r} ${r} 0 0 0 ${vx.toFixed(1)} ${vy.toFixed(1)}`;
  return `<svg viewBox="0 0 180 110" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <path d="${bpath}" fill="none" stroke="var(--track)" stroke-width="12" stroke-linecap="round"/>
    <path d="${vpath}" fill="none" stroke="${zoneColor}" stroke-width="12" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--text)"/>
    <text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${(+value).toFixed(value%1===0?0:1)}</text>
  </svg><div class="gz" style="color:${zoneColor}">${zl}</div>`;
}
function gaugeZones(type){
  if(type==="fearGreed") return [
    {max:0.25,color:"#d83a3a",label:t('zone.ef')},{max:0.45,color:"#d99100",label:t('zone.f')},
    {max:0.55,color:"#caa400",label:t('zone.n')},{max:0.75,color:"#15a34a",label:t('zone.g')},
    {max:1,color:"#0e7d38",label:t('zone.eg')}];
  if(type==="buffett") return [

    {max:0.857,color:"#caa400",label:t('zone.fair')},{max:1.071,color:"#d99100",label:t('zone.high')},
    {max:1,color:"#d83a3a",label:t('zone.exp')}];
  if(type==="graham") return [
    {max:0.333,color:"#d83a3a",label:t('zone.rich')},{max:0.5,color:"#d99100",label:t('zone.high')},
    {max:0.667,color:"#caa400",label:t('zone.fair')},{max:1,color:"#15a34a",label:t('zone.cheap')}];
  return [{max:1,color:"var(--primary)",label:""}];
}
function barMeter(value,min,max){
  const v=Math.max(min,Math.min(max,parseFloat(value)||0));
  const pct=Math.max(2,Math.min(100,((v-min)/(max-min))*100));
  return `<div class="pbar"><i style="width:${pct.toFixed(0)}%"></i></div>`;
}

function renderNewsCard(){
  const manual = (state.news||[]).map((n,i)=>({n,origin:"manual",idx:i}));
  const auto = AUTO_NEWS.map((n,i)=>({n,origin:"auto",idx:i}));
  let items = manual.concat(auto);
  if(newsFilter!=="all") items = items.filter(it=>(it.n.category||"other")===newsFilter);
  // 排序：重要置顶，其次日期倒序
  items.sort((a,b)=>{
    const ai=a.n.important?1:0, bi=b.n.important?1:0;
    if(ai!==bi) return bi-ai;
    return (b.n.date||"").localeCompare(a.n.date||"");
  });
  const cap=s=>s? s.charAt(0).toUpperCase()+s.slice(1):"";
  const dateLabel=d=>{
    if(!d) return "";
    const today=new Date().toISOString().slice(0,10);
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(d===today) return d+" · 今天";
    if(d===y) return d+" · 昨天";
    return d;
  };
  const starSvg=on=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.8 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/></svg>`;
  let body="";
  if(items.length){
    let lastDate="";
    items.forEach(it=>{
      const n=it.n, star=!!n.important, cat=n.category||"other", imp=n.impact||"";
      if((n.date||"")!==lastDate){ lastDate=n.date||""; body+=`<div class="news-date-h">${dateLabel(lastDate)}</div>`; }
      const tagAuto = it.origin==="auto";
      const starEl = tagAuto
        ? `<span class="news-star ${star?'on':''}" style="cursor:default">${starSvg(star)}</span>`
        : `<button class="news-star ${star?'on':''}" data-starnews="${it.idx}" title="${t('dashNewsImp')}">${starSvg(star)}</button>`;
      const delEl = tagAuto? "" : `<button class="icon-btn" data-delnews="${it.idx}" title="${t('del')}" style="margin-left:auto;padding:2px 6px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>`;
      body += `
      <div class="news-item">
        ${starEl}
        <div class="news-body">
          ${n.url?`<a class="news-title ${star?'imp':''}" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:`<span class="news-title ${star?'imp':''}">${esc(n.title)}</span>`}
          <div class="news-meta">
            ${n.source?`<span class="src">${esc(n.source)}</span>`:''}
            ${cat!=="other"?`<span class="news-cat">${t('newsCat'+cap(cat))}</span>`:''}
            ${imp?`<span class="news-imp ${imp}">${t('newsImp'+cap(imp))}</span>`:''}
            ${star?`<span class="imp-tag">★ ${t('dashNewsImp')}</span>`:''}
            ${n.sample?`<span class="tag auto">${t('dashNewsSample')}</span>`:''}
            ${tagAuto?`<span class="tag auto">${t('dashNewsAuto')}</span>`:''}
            ${delEl}
          </div>
        </div>
      </div>`;
    });
  } else { body=`<div class="muted" style="padding:14px">${t('dashNewsEmpty')}</div>`; }

  const cats=[["all",t('dashNewsCatAll')],["macro",t('newsCatMacro')],["market",t('newsCatMarket')],["industry",t('newsCatIndustry')],["company",t('newsCatCompany')],["other",t('newsCatOther')]];
  const chips = cats.map(([k,l])=>`<button class="news-chip ${newsFilter===k?'on':''}" data-newscat="${k}">${l}</button>`).join("");
  const sampleCount = manual.filter(n=>n.sample).length;
  const todayStr = new Date().toISOString().slice(0,10);
  const catOpts = cats.filter(c=>c[0]!=="all").map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  const impOpts = [["","—"],["up",t('newsImpUp')],["down",t('newsImpDown')],["neutral",t('newsImpNeutral')]].map(([k,l])=>`<option value="${k}">${l}</option>`).join("");

  return `
  <div class="card" style="margin-bottom:16px">
    <h3>${t('dashNews')} <span class="tag">${items.length} ${t('dashNewsCount')}</span>
      ${NEWS_UPDATED_AT?`<span class="tag auto" style="margin-left:6px">${t('dashNewsUpdated')} ${esc(NEWS_UPDATED_AT)}</span>`:''}
      ${sampleCount?`<button class="mini-btn" data-clearnews="1" style="margin-left:auto">${t('newsClearSample')}</button>`:''}</h3>
    <div class="hint">${t('dashNewsHint')}</div>
    <div class="news-chips">${chips}</div>
    <div class="news-list">${body}</div>
    <div class="news-add">
      <input id="newsTitle" placeholder="${t('newsTitlePh')}" style="grid-column:1/-1">
      <select id="newsCat">${catOpts}</select>
      <select id="newsImpact">${impOpts}</select>
      <input id="newsSource" placeholder="${t('dashNewsSource')}…">
      <input id="newsDate" type="date" value="${todayStr}">
      <input id="newsUrl" placeholder="${t('dashNewsUrl')}" style="grid-column:1/-1">
      <div class="full">
        <label><input type="checkbox" id="newsImp" style="width:16px;height:16px;accent-color:var(--primary)"> ${t('dashNewsImp')}</label>
        <button class="mini-btn primary" id="addNews" style="margin-left:auto;background:var(--primary);color:#fff">${t('addRow')}</button>
      </div>
    </div>
  </div>`;
}
function renderHoldings(){
  const h=state.holdings;
  const totalCost=h.reduce((a,b)=>a+(parseFloat(b.cost)||0),0);
  const totalMkt=h.reduce((a,b)=>a+(parseFloat(b.market)||0),0);
  const profit=totalMkt-totalCost;
  const rows=h.map((b,i)=>{
    const c=parseFloat(b.cost)||0, m=parseFloat(b.market)||0;
    const p=m-c, r=c>0?(p/c*100):0, w=totalMkt>0?(m/totalMkt*100):0;

      // 同步项：核心字段只读，仅备注可编辑，无删除（下次同步自动覆盖）

        <td class="num">${w.toFixed(1)}%</td>

      <td class="num"><button class="icon-btn" data-del="custom" data-i="${i}" title="${t('del')}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></td>

// 同步时间格式化
function fmtSync(iso){
  try{ const d=new Date(iso); const p=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
  catch(e){ return iso; }
}

/* ============== Events ============== */
function bindEvents(){
  // nav
  document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>render(b.dataset.view)));
  // input binding (delegated)
  document.querySelector(".content").addEventListener("change",onFieldChange);
  document.querySelector(".content").addEventListener("input",onFieldInput);
  // clicks (add/del/buttons)
  document.querySelector(".content").addEventListener("click",onContentClick);
  // topbar
  document.getElementById("btnLang").addEventListener("click",()=>setLang(lang==="zh"?"en":"zh"));
  document.getElementById("btnTheme").addEventListener("click",()=>setTheme(getTheme()==="light"?"dark":"light"));
  document.getElementById("btnExport").addEventListener("click",exportBackup);
  document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change",importBackup);
  document.getElementById("btnClear").addEventListener("click",confirmClear);
  // modal
  document.getElementById("modalMask").addEventListener("click",e=>{ if(e.target.id==="modalMask") closeModal(); });
}

function onFieldInput(e){
  const el=e.target;
  // live, focus-safe update only for the health sliders (avg header text only)
  if(el.dataset.bind==="health" && el.type==="range"){
    state.health[+el.dataset.i].value=+el.value; save(); updateHealthHeader();
  }
}
function updateHealthHeader(){
  const avgH=Math.round(state.health.reduce((a,b)=>a+(parseFloat(b.value)||0),0)/state.health.length);
  const tag=document.querySelector('#view-dashboard .card .tag');
  // find health card tag
  const cards=document.querySelectorAll('#view-dashboard .card');
  cards.forEach(c=>{ const h3=c.querySelector('h3'); if(h3 && h3.textContent.includes(t('dashHealth'))){ const tg=h3.querySelector('.tag'); if(tg) tg.textContent=t('overall')+' '+avgH; } });
}
function onFieldChange(e){
  const el=e.target;
  // 同步行备注：按基金代码存入备注表（不污染同步源）
  if(el.dataset.noteCode){
    const code=el.dataset.noteCode; const notes=loadNotes(); notes[code]=el.value; saveNotes(notes);
    const row=state.holdings.find(x=>x.code===code); if(row) row.note=el.value;
    return;
  }
  if(!el.dataset.bind) return;
  const b=el.dataset.bind, i=+el.dataset.i, k=el.dataset.k, f=el.dataset.f, g=el.dataset.g;
  if(b==="custom"){
    const row=state.holdings[i]; if(!row) return;
    let val=el.value; if(el.type==="number") val=parseFloat(val)||0;
    row[f]=val; saveCustom(state.holdings.filter(x=>!x.synced)); save(); return;
  }
  if(b==="watch"||b==="managers"||b==="companies"||b==="tools"||b==="netWorth"){
    const idx=i; if(!state[b][idx]) return;
    let val=el.value; if(el.type==="number") val=parseFloat(val)||0;
    state[b][idx][f]=val;
  } else if(b==="macro"){
    const it=state.macro[g].find(x=>x.key===k); if(it) it.value=el.value;
  } else if(b==="sentiment"){
    const s=state.sentiment.find(x=>x.key===k); if(s) s.value=el.value;
  } else if(b==="health"){
    state.health[+i][f]=+el.value;
  } else if(b==="funnel"){
    state.funnel[+i][f]=el.value;
  }
  save(); renderActive();
}
function onContentClick(e){
  const tgt=e.target.closest("[data-del],[data-add],[data-foc],[data-delfoc],[id]");
  if(!tgt) return;
  if(tgt.dataset.del){ const b=tgt.dataset.del,i=+tgt.dataset.i;
    if(b==="custom"){ state.holdings.splice(i,1); saveCustom(state.holdings.filter(x=>!x.synced)); save(); renderActive(); toast(t('toastDeleted')); return; }
    if(state[b]){ state[b].splice(i,1); save(); renderActive(); toast(t('toastDeleted')); } return; }
  if(tgt.dataset.add){ const b=tgt.dataset.add; addItem(b); return; }
  if(tgt.dataset.foc!==undefined){ const i=+tgt.dataset.foc; state.focus[i].done=!state.focus[i].done; save(); renderActive(); return; }
  if(tgt.dataset.delfoc!==undefined){ const i=+tgt.dataset.delfoc; state.focus.splice(i,1); save(); renderActive(); return; }
  if(tgt.id==="addFocus"){ const inp=document.getElementById("focusInput"); const v=inp.value.trim(); if(v){ state.focus.unshift({text:v,done:false,source:"manual",createdAt:new Date().toISOString().slice(0,10)}); inp.value=""; save(); renderActive(); toast(t('toastAdded')); } return; }
  if(tgt.dataset.delnews!==undefined){ const i=+tgt.dataset.delnews; state.news.splice(i,1); save(); renderActive(); toast(t('toastDeleted')); return; }
  if(tgt.dataset.starnews!==undefined){ const i=+tgt.dataset.starnews; state.news[i].important=!state.news[i].important; save(); renderActive(); return; }
  if(tgt.dataset.clearnews!==undefined){ state.news=state.news.filter(n=>!n.sample); save(); renderActive(); toast(t('toastDeleted')); return; }
  if(tgt.id==="addNews"){ addNewsFromForm(); return; }
  if(tgt.dataset.newscat!==undefined){ newsFilter=tgt.dataset.newscat; renderActive(); return; }
  if(tgt.id==="holdAdd"){ const custom=loadCustom(); custom.push({name:"",code:"",cost:0,market:0,note:""}); saveCustom(custom); state.holdings=buildHoldings(); renderActive(); toast(t('toastAdded')); return; }
  if(tgt.id==="holdSync"){ syncHoldings(); syncNews(); return; }
  if(tgt.id==="holdCsv"){ exportCsv(); return; }
}
// 同步持仓：部署版 fetch holdings-data.json；本地版从内嵌同步源重载
function syncHoldings(){
  const btn=document.getElementById("holdSync"); if(btn) btn.disabled=true;
  if(location.protocol!=="file:"){
    fetch("./holdings-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(j=>{ if(j&&j.holdings){ MEM_SYNCED=j.holdings; MEM_SYNCED_AT=j.syncedAt||new Date().toISOString();
        state.holdings=buildHoldings(); save(); renderActive(); toast("持仓已重载 ✓（本机 ttskill 同步快照）"); } })
      .catch(()=>{ toast(t('holdNoSync')); })
      .finally(()=>{ if(btn) btn.disabled=false; });
  } else {
    state.holdings=buildHoldings(); save(); renderActive(); toast("持仓已重载 ✓（本机同步快照 "+fmtSync(syncedAtStr())+"）");
    if(btn) btn.disabled=false;
  }
}
// 同步自动源要闻：
//  - 本地(file://)与线上基线：读取内联 SYNCED_NEWS（每日自动化注入，不受 file:// 无法 fetch 的限制）
//  - 部署版(http)：再 fetch news-data.json（每日自动化推送）拿最新覆盖，保证线上永远最新
function applyAutoNews(j){
  if(j && Array.isArray(j.news)){ AUTO_NEWS=j.news; NEWS_UPDATED_AT=j.updatedAt||""; renderActive(); }
}
function syncNews(){
  if(typeof SYNCED_NEWS!=="undefined" && SYNCED_NEWS && SYNCED_NEWS.length){
    applyAutoNews({ updatedAt:(typeof SYNCED_NEWS_AT!=="undefined"?SYNCED_NEWS_AT:""), news:SYNCED_NEWS });
  }
  if(location.protocol!=="file:"){
    fetch("./news-data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("net"); return r.json(); })
      .then(applyAutoNews)
      .catch(()=>{});
  }
}
function addItem(b){
  if(b==="netWorth"){ const last=state.netWorth[state.netWorth.length-1]; const nm=last?incMonth(last.m):"2026-08"; state.netWorth.push({m:nm,v:last?last.v:100}); }
  else if(b==="funnel"){ state.funnel.push({zh:"新层级",en:"New Stage",value:0}); }
  else if(b==="watch"){ state.watch.push({code:"",name:"",note:""}); }
  else if(b==="managers"){ state.managers.push({name:"",fund:"",note:""}); }
  else if(b==="companies"){ state.companies.push({name:"",industry:"",moat:"",finance:"",valuation:"",mgmt:"",stage:"scr",note:""}); }
  else if(b==="tools"){ state.tools.push({name:"新工具",desc:"",note:""}); }
  save(); renderActive(); toast(t('toastAdded'));
}
function incMonth(ym){ const [y,m]=ym.split("-").map(Number); const nm=m===12?1:m+1; const ny=m===12?y+1:y; return ny+"-"+String(nm).padStart(2,"0"); }
function addNewsFromForm(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:""; };
  const title=g("newsTitle").trim(), source=g("newsSource").trim(),
        date=g("newsDate").trim()||new Date().toISOString().slice(0,10),
        url=g("newsUrl").trim(),
        category=g("newsCat")||"other",
        impact=g("newsImpact")||"",
        important=!!(document.getElementById("newsImp")||{}).checked;
  if(!title){ toast(t('newsTitlePh')); return; }
  state.news.unshift({title,source,date,url,category,impact,important,sample:false,createdAt:new Date().toISOString().slice(0,10)});
  save(); renderActive(); toast(t('newsAddOk'));
}

/* ============== Export / Import / Clear ============== */
function exportBackup(){
  const data={ _app:"投资管理工作台", _ver:1, _exported:new Date().toISOString(),
    theme:getTheme(), lang:lang, data:state };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="投资工作台备份_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast(t('exportOk'));
}
function importBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const obj=JSON.parse(rd.result);
    let data = obj.data ? obj.data : obj;
    state = (typeof data==="object" && !Array.isArray(data)) ? data : defaultState();
    if(obj.theme) setTheme(obj.theme); if(obj.lang) setLang(obj.lang);
    // 持仓：同步项由 ttskill 主导，仅保留导入中的自定义行与备注
    const imp = (state.holdings||[]);
    saveCustom(imp.filter(x=>x.synced===false).map(x=>({name:x.name,code:x.code,cost:x.cost,market:x.market,note:x.note})));
    const notes=loadNotes(); imp.forEach(x=>{ if(x.note && x.code) notes[x.code]=x.note; }); saveNotes(notes);
    state.holdings = buildHoldings();
    persist(state);
    renderActive(); applyStaticI18n(); toast(t('importOk'));
  }catch(err){ toast(t('importFail')); } };
  rd.readAsText(file); e.target.value="";
}
function exportCsv(){
  const rows=[["名称","代码","成本","市值","浮动盈亏","收益率","备注"]];
  state.holdings.forEach(b=>{ const c=+b.cost||0,m=+b.market||0,p=m-c,r=c>0?(p/c*100):0;
    rows.push([b.name,b.code,c,m,p.toFixed(0),r.toFixed(1)+"%",b.note]); });
  const csv="\uFEFF"+rows.map(r=>r.map(x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="持仓导出.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function confirmClear(){
  openModal(`<h3>${t('clearTitle')}</h3><p>${t('clearMsg')}</p>
    <div class="actions"><button class="mini-btn" data-close>${t('cancel')}</button>
    <button class="mini-btn danger" id="doClear" style="border-color:var(--danger);color:var(--danger)">${t('clearConfirm')}</button></div>`);
  document.getElementById("doClear").addEventListener("click",()=>{
    localStorage.removeItem(LS_MAIN); state=defaultState(); persist(state); renderActive(); closeModal(); toast(t('toastDeleted'));
  });
}

/* ============== Modal / Add-to-home ============== */
function openModal(html){ const box=document.getElementById("modalBox"); box.innerHTML=html; document.getElementById("modalMask").classList.add("show");
  box.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal)); }
function closeModal(){ document.getElementById("modalMask").classList.remove("show"); }
function showAddHome(){
  openModal(`<h3>${t('addHomeTitle')}</h3><p>${t('addHomeMsg')}</p>
    <div class="steps"><div>1. ${t('addHomeIos')}</div><div>2. ${t('addHomeAndroid')}</div></div>
    <p style="margin-top:10px">${t('addHomeNote')}</p>
    <div class="actions"><button class="mini-btn primary" style="background:var(--primary);color:#fff" data-close>${t('close')}</button></div>`);
}

/* ============== Init ============== */
function init(){
  initLang();
  setTheme(getTheme());
  document.getElementById("langLabel").textContent = (lang==="zh")?"EN":"中";
  applyStaticI18n();
  bindEvents();
  render("dashboard");
  if(location.protocol!=="file:"){ syncHoldings(); syncNews(); }   // 部署版：打开即拉取最新持仓 + 自动源要闻
  // long-press / dblclick brand to show add-home hint? add a small entry: press logo 2s
  document.querySelector(".brand .logo").addEventListener("click",showAddHome);
}
init();
