<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16a34a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316a34a'/%3E%3Cpath d='M20 34 L29 43 L45 24' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E6%8A%95%E8%B5%84%E7%AE%A1%E7%90%86%E5%B7%A5%E4%BD%9C%E5%8F%B0%22%2C%22short_name%22%3A%22%E6%8A%95%E8%B5%84%E5%8F%B0%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f7f5%22%2C%22theme_color%22%3A%22%2316a34a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D'http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%253D'0%25200%252064%252064'%253E%253Crect%2520width%253D'64'%2520height%253D'64'%2520rx%253D'14'%2520fill%253D'%252316a34a'%252F%253E%253Cpath%2520d%253D'M20%253034%2520L29%253043%2520L45%253024'%2520stroke%253D'white'%2520stroke-width%253D'6'%2520fill%253D'none'%2520stroke-linecap%253D'round'%2520stroke-linejoin%253D'round'%252F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%2264x64%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<title>投资管理工作台</title>
<style>
:root[data-theme="light"]{
  --bg:#F5F5F7; --panel:#FFFFFF; --panel2:#F4F5F8; --text:#1D1D1F; --muted:#6E6E73;
  --primary:#0071E3; --primary-d:#0058C7; --primary-weak:#E8F1FD; --primary-weak2:#F2F8FF;
  --brand:#0071E3;
  --border:#D7D7DC; --border-strong:#C2C2C8;
  --shadow:0 14px 44px rgba(0,0,0,.18);
  --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.05);
  --shadow-tile:0 1px 2px rgba(0,0,0,.04);
  --danger:#D92D20; --warn:#B7791F; --success:#1F9D55; --info:#0071E3;
  --grid:#ECECEF; --track:#E3E3E8;
  --r-sm:10px; --r:14px; --r-lg:22px; --r-pill:999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --nav-bg:rgba(255,255,255,.72); --nav-border:rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1C1C1E; --panel2:#2C2C2E; --text:#F5F5F7; --muted:#98989D;
  --primary:#0A84FF; --primary-d:#409CFF; --primary-weak:rgba(10,132,255,.22); --primary-weak2:rgba(10,132,255,.12);
  --brand:#0A84FF;
  --border:#38383A; --border-strong:#48484A;
  --shadow:0 14px 44px rgba(0,0,0,.6);
  --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  --shadow-tile:0 1px 2px rgba(0,0,0,.4);
  --danger:#FF5247; --warn:#E0A93B; --success:#3DD68C; --info:#0A84FF;
  --grid:#2A2A2C; --track:#3A3A3C;
  --r-sm:10px; --r:14px; --r-lg:22px; --r-pill:999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --nav-bg:rgba(28,28,30,.72); --nav-border:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
  line-height:1.55; font-size:14.5px; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--primary-d);text-decoration:none}
a:hover{text-decoration:underline}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex:0 0 232px;background:var(--nav-bg);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-right:1px solid var(--nav-border);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .logo{width:38px;height:38px;flex:0 0 38px;border-radius:var(--r);background:var(--brand);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;letter-spacing:.5px;
  box-shadow:0 1px 2px rgba(0,113,227,.30)}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--muted);
  font-size:14px;font-weight:600;border:none;background:transparent;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item svg{width:19px;height:19px;flex:0 0 19px}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary-d)}
.sidebar .spacer{flex:1}
.side-foot{font-size:11px;color:var(--muted);padding:8px;text-align:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 22px;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--nav-border);position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.topbar h1{font-family:var(--font-display);font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:120px}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel2);
  color:var(--text);padding:8px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:600;min-height:40px;
  transition:transform .12s ease,background .15s,border-color .15s,color .15s;
}
.tbtn:hover{border-color:var(--primary);color:var(--primary-d)}
.tbtn svg{width:17px;height:17px}
.tbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn.primary:hover{background:var(--primary-d);color:#fff}
.tbtn:active{transform:scale(.96)}

.content{padding:22px;padding-bottom:44px}
.view{display:none;animation:fade .35s cubic-bezier(.32,.72,0,1)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cards / grid */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow-card);transition:box-shadow .2s ease,transform .2s ease}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.05),0 14px 36px rgba(0,0,0,.07)}
.card h3{margin:0 0 14px;font-family:var(--font-display);font-size:16.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:600;color:var(--primary-d);background:var(--primary-weak);
  padding:2px 9px;border-radius:var(--r-pill);font-family:var(--font-sans)}
.card .hint{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:13px;font-weight:700}
.hv{display:inline-block;white-space:nowrap}
.hold-scroll{overflow-x:auto}
.hold-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hold-actions{flex-wrap:wrap;gap:8px}
@media(max-width:820px){
  .hold-kpis{grid-template-columns:1fr;gap:8px}
  .hold-kpis .kpi{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
  .hold-kpis .kpi .label{font-size:12.5px;flex:0 0 auto}
  .hold-kpis .kpi .val{font-size:20px;flex:0 0 auto}
}
.up{color:var(--danger)} .down{color:var(--success)}
.muted{color:var(--muted)}
.tag.auto{font-size:10px;font-weight:700;color:var(--primary-d);background:var(--primary-weak);padding:1px 7px;border-radius:var(--r-pill);vertical-align:middle}
.sync-bar{font-size:12px;margin:-4px 0 10px;padding:8px 11px;border:1px dashed var(--border);border-radius:var(--r-sm);background:var(--panel2)}
tr.synced td:first-child{font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.right{margin-left:auto}
.section-title{font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;margin:6px 0 14px;display:flex;align-items:center;gap:8px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
table.hold-table{min-width:720px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td input,td select{border:1px solid var(--border);background:var(--panel2);color:var(--text);
  border-radius:var(--r-sm);padding:7px 8px;width:100%;font-size:14px}
td input:focus,td select:focus{outline:none;border-color:var(--primary)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mini-btn{border:1px solid var(--border);background:var(--panel2);border-radius:var(--r-sm);padding:6px 10px;
  font-size:13px;color:var(--text);min-height:36px;
  transition:transform .12s ease,background .15s,border-color .15s,color .15s}
.mini-btn:hover{border-color:var(--primary);color:var(--primary-d)}
.mini-btn:active{transform:scale(.96)}
.mini-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.icon-btn{border:none;background:transparent;color:var(--muted);padding:6px;border-radius:var(--r-sm);min-height:36px;min-width:36px;
  transition:transform .12s ease,background .15s,color .15s}
.icon-btn:hover{background:var(--panel2);color:var(--danger)}
.icon-btn:active{transform:scale(.92)}

/* progress bar */
.pbar{height:8px;border-radius:var(--r-pill);background:var(--track);overflow:hidden;margin:6px 0}
.pbar > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--primary);transition:width .4s}
.health-row{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.health-row .top{display:flex;justify-content:space-between;font-size:13.5px}
.health-row .top b{font-variant-numeric:tabular-nums}

/* focus list */
.focus-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;background:var(--panel2);box-shadow:var(--shadow-tile)}
.focus-item.done{opacity:.55}
.focus-item .txt{flex:1;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.focus-item .txt s{color:var(--muted)}
.focus-item .due{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);padding:1px 7px;border-radius:10px;font-variant-numeric:tabular-nums}
.focus-item .due.over{color:#fff;background:var(--danger);border-color:var(--danger)}

/* 财经要闻 */
.news-list{max-height:380px;overflow-y:auto;margin:-2px 0 2px}
.news-item{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-star{flex:0 0 auto;background:transparent;border:none;padding:2px;color:var(--muted);min-width:30px;min-height:30px;cursor:pointer}
.news-star:hover{color:var(--warn)}
.news-star.on{color:var(--warn)}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;font-weight:600;line-height:1.45;color:var(--text);text-decoration:none;display:inline-block;word-break:break-word}
.news-title:hover{text-decoration:underline;color:var(--primary-d)}
.news-title.imp{color:var(--primary-d)}
.news-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news-meta .src{color:var(--primary);font-weight:600}
.news-meta .imp-tag{color:var(--warn);background:rgba(183,121,31,.14);padding:1px 7px;border-radius:var(--r-pill)}
.news-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.news-chip{font-size:12px;padding:3px 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;
  transition:transform .12s ease,background .15s,border-color .15s,color .15s}
.news-chip:hover{border-color:var(--primary)}
.news-chip:active{transform:scale(.96)}
.news-chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.news-cat{font-size:11px;font-weight:600;color:var(--primary-d);background:var(--primary-weak);padding:1px 8px;border-radius:var(--r-pill)}
.news-imp{font-size:11px;font-weight:600;padding:1px 8px;border-radius:var(--r-pill)}
.news-imp.up{color:var(--success);background:rgba(31,157,85,.12)}
.news-imp.down{color:var(--danger);background:rgba(217,45,32,.10)}
.news-imp.neutral{color:var(--muted);background:var(--panel2)}
.news-date-h{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.news-date-h::after{content:'';flex:1;height:1px;background:var(--border)}
.tag.auto{color:var(--primary-d);background:var(--primary-weak)}
.tag.warn{color:var(--warn);background:rgba(183,121,31,.14)}

/* gauge wrap */
.gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gauge-card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--shadow-tile)}
.gauge-card .gv{font-size:22px;font-weight:800;margin-top:-6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge-card .gl{font-size:12.5px;color:var(--muted);margin-top:2px}
.gauge-card .gz{font-size:11.5px;font-weight:700;margin-top:4px}

/* indicator grid */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.ind-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-card);transition:transform .14s cubic-bezier(.32,.72,0,1),box-shadow .18s}
.ind-card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.07)}
.ind-card .il{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4;min-height:36px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.ind-card .iv{display:flex;align-items:baseline;gap:5px;margin-top:10px}
.ind-info-toggle{display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;line-height:1;font-family:inherit;
  transition:transform .12s ease,color .15s,border-color .15s}
.ind-info-toggle:hover{color:var(--primary);border-color:var(--primary)}
.ind-info-toggle:active{transform:scale(.96)}
.ind-info{margin-top:10px}
.ind-info-h{font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.04em;margin-bottom:2px}
.ind-info dl{margin:10px 0 2px;padding-top:10px;border-top:1px dashed var(--border);display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;line-height:1.55}
.ind-info dt{color:var(--muted);font-weight:600;white-space:nowrap}
.ind-info dd{margin:0;color:var(--text)}
.ind-info .trend{display:inline-flex;align-items:center;gap:4px}
.trend-up{color:var(--danger)} .trend-down{color:var(--success)} .trend-flat{color:var(--muted)}
.rel-advice{margin-top:10px;padding:11px 13px;background:rgba(183,121,31,.07);border:1px solid rgba(183,121,31,.22);border-left:3px solid var(--warn);border-radius:var(--r)}
.rel-advice .ra-h{font-size:11px;font-weight:700;color:var(--warn);letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.rel-advice .ra-h::before{content:"";width:3px;height:12px;background:var(--warn);border-radius:2px}
.rel-advice .ra-row{display:flex;gap:8px;font-size:12px;line-height:1.62;margin-top:6px}
.rel-advice .ra-k{flex:0 0 56px;color:var(--warn);opacity:.85;font-weight:600;white-space:nowrap}
.rel-advice .ra-v{flex:1;color:var(--text)}
.anomaly-analysis{margin-top:8px;padding:9px 13px;background:var(--primary-weak);border-left:3px solid var(--primary);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:12px;line-height:1.6;color:var(--text)}
.anomaly-analysis .anomaly-title{font-weight:700;color:var(--primary-d);margin-bottom:2px;font-size:11.5px;letter-spacing:.03em}
.anomaly-analysis .anomaly-body{color:var(--muted)}
.ind-card input{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:var(--r-sm);
  padding:6px 8px;width:120px;font-size:18px;font-variant-numeric:tabular-nums}
.ind-card .iu{font-size:13px;color:var(--muted);font-weight:600}
.ind-card .rv{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.ind-card .in{font-size:11.5px;color:var(--muted);margin-top:6px}
/* 指标来源渠道 + 数据日期（磁贴底部始终可见） */
.src-line{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:10.5px;line-height:1.4;color:var(--muted);font-variant-numeric:tabular-nums}
.src-line .src-chan{color:var(--text);font-weight:600;opacity:.82}
.src-line .src-sep{color:var(--border);font-weight:700}
.src-line .src-date{color:var(--muted)}
.src-line.muted .src-chan{color:var(--muted);font-weight:500}
.ind-card .tile-arrow{font-size:12px;margin-top:9px;display:inline-flex;align-items:center;gap:4px;font-weight:600}
/* 折叠释义：默认收起，点 ⓘ 展开 */
.ind-card .ind-info,.ind-card .anomaly-analysis{display:none}
.ind-card.open .ind-info{display:block;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.ind-card.open .anomaly-analysis{display:block;margin-top:12px}
.cat-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}

/* funnel */
.funnel-stage{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.funnel-bar{height:42px;border-radius:var(--r-sm) var(--r-sm) 0 0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px;transition:width .4s;min-width:60px;background:var(--primary)}
.funnel-meta{font-size:13px;color:var(--muted);white-space:nowrap}
.funnel-meta b{color:var(--text);font-size:15px}

/* list cards (funds/companies/tools) */
.item-card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-tile)}
.item-card .ic-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.item-card .ic-title{font-weight:700;font-size:15px;flex:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fgrid input,.fgrid select,.fgrid textarea{border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:var(--r-sm);padding:8px;width:100%;font-size:14px}
.fgrid textarea{min-height:60px;resize:vertical}
.funnel-tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.funnel-tool input{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:var(--r-sm);
  padding:7px 8px;font-size:14px;transition:transform .12s ease}
.funnel-tool input:active{transform:scale(.98)}
.funnel-tool input.v{width:90px;text-align:right}

/* toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--text);
  color:var(--bg);padding:12px 18px;border-radius:var(--r);font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:var(--shadow);max-width:90vw;text-align:center;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;align-items:center;
  justify-content:center;z-index:80;padding:20px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);max-width:440px;width:100%;
  padding:22px;box-shadow:var(--shadow);max-height:85vh;overflow:auto}
.modal h3{margin:0 0 12px;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.modal p{font-size:14px;color:var(--muted);line-height:1.6}
.modal .steps{font-size:14px;line-height:1.9;padding-left:18px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* bottom tab (mobile) */
.bottom-tab{display:none}
@media(max-width:820px){
  .sidebar{display:none}
  .bottom-tab{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--nav-bg);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid var(--nav-border);z-index:30;overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-tab .nav-item{flex:1 1 0;flex-direction:column;gap:2px;padding:7px 1px;border-radius:0;font-size:10px;min-width:0;
    justify-content:center;min-height:54px;overflow:hidden;text-align:center}
  .bottom-tab .nav-item.active{background:transparent;color:var(--primary);box-shadow:none}
  .bottom-tab .nav-item:active{transform:scale(.92)}
  .bottom-tab .nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
  .bottom-tab .nav-item svg{width:20px;height:20px}
  .content{padding:14px;padding-bottom:84px}
  .topbar{padding:11px 14px}
  .topbar h1{font-size:15px}
  .tbtn{padding:7px 10px;font-size:12px}
  .cols-2,.cols-3,.cols-4{grid-template-columns:1fr}
  /* 宏观指标磁贴手机端占满屏：卡片去左右内边距 + 负margin抵消内容区留白，网格两列宫格 */
  .card.macro-card{margin-left:-14px;margin-right:-14px;padding-left:2px;padding-right:2px}
  .ind-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .val{font-size:22px}
  .hold-scroll{overflow:visible}
  table.hold-table{min-width:0;border:0}
  table.hold-table thead{display:none}
  table.hold-table tr{display:block;border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;padding:2px 6px;background:var(--panel2)}
  table.hold-table tbody tr.synced{background:var(--panel2)}
  table.hold-table td{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:9px 8px;text-align:right}
  table.hold-table td:last-child{border-bottom:none}
  table.hold-table td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:0 0 auto;margin-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  table.hold-table td[data-label=""]::before{display:none}
  table.hold-table td[data-label=""]{justify-content:flex-end}
  table.hold-table td .hv,table.hold-table td.num{white-space:nowrap;flex:0 0 auto;min-width:0}
  table.hold-table td:not(.num):not(:has(.hv)){word-break:break-all;line-height:1.4}
  table.hold-table td input,table.hold-table td select{width:auto;min-width:120px;flex:1 1 auto;max-width:62%;text-align:right;font-size:16px}
}
@media(min-width:821px){ .bottom-tab{display:none!important} .content{max-width:1180px;margin:0 auto;width:100%} }

.curve-title{font-size:13.5px;font-weight:700;color:var(--text);display:flex;align-items:baseline;gap:8px;margin-bottom:2px}

  // 旧版月度点（含 m 无 d）迁移为日点
  s.netWorth.forEach(p=>{ if(p && p.m!=null && p.d==null){ p.d=p.m+"-01"; delete p.m; } });
  // 合并每日自动化写入的净资产点（服务端权威，按日期去重覆盖）——即使当天未打开页面也累积
  const syncedNW=(typeof SYNCED_NETWORTH!=="undefined" && Array.isArray(SYNCED_NETWORTH))?SYNCED_NETWORTH:[];
  if(syncedNW.length){
    const nmap={}; s.netWorth.forEach(p=>{ if(p&&p.d) nmap[p.d]=p; });
    syncedNW.forEach(p=>{ if(p&&p.d) nmap[p.d]={d:p.d,v:p.v}; });
    s.netWorth=Object.keys(nmap).sort().map(k=>nmap[k]); dirty=true;
  }
  const lastNW = s.netWorth[s.netWorth.length-1];
  const _today = todayStr();
  if(!lastNW || lastNW.d!==_today){ s.netWorth.push({d:_today, v:realTotalAsset()}); dirty=true; }
  if(!s.nwAnchor || s.nwAnchor > "2026-07-01"){ s.nwAnchor = "2026-07-01"; dirty=true; }  // 固定锚点：7月1日（旧的上周一锚点回拨到7/1）
  // 宏观：兼容旧备份（新增 momentum 组 / 缺失 key）——避免 state.macro.momentum 为 undefined 导致渲染崩溃
  const ds = defaultState();
  const dm = ds.macro;
  s.macro = s.macro || {};
  ["money","pc","momentum"].forEach(g=>{
    const defKeys = new Set(dm[g].map(x=>x.key));
    if(!Array.isArray(s.macro[g])){ s.macro[g] = dm[g].map(x=>({...x})); dirty=true; }
    else {
      // 丢弃旧版残留的指标（如已删除的 SOFR / 旧占位 oecd），仅保留当前规范集内的 key
      const before = s.macro[g].length;
      s.macro[g] = s.macro[g].filter(x=>x && defKeys.has(x.key));
      if(s.macro[g].length !== before) dirty=true;
      const have = new Set(s.macro[g].map(x=>x && x.key));
      dm[g].forEach(d=>{ if(!have.has(d.key)){ s.macro[g].push({...d}); dirty=true; } });
    }
  });
  // 指数&基金模块重构（替代旧 watch/managers/companies）：新结构 indices/funds，丢弃旧结构
  if(!Array.isArray(s.indices)){ s.indices = ds.indices.map(x=>({...x})); dirty=true; }
  if(!Array.isArray(s.funds)){ s.funds = ds.funds.map(x=>({...x})); dirty=true; }
  delete s.watch; delete s.managers; delete s.companies;
  // 指数&基金：以每日真实同步数据(SYNCED_INDEX)为准，覆盖种子
  if(typeof SYNCED_INDEX!=="undefined" && SYNCED_INDEX && Array.isArray(SYNCED_INDEX.indices) && Array.isArray(SYNCED_INDEX.funds)){
    s.indices = SYNCED_INDEX.indices;
    s.funds = SYNCED_INDEX.funds;
    dirty=true;
  }
  // 自动待办：指数/基金最新值跌破250日均线(年线) → 生成【风险】待办（保留用户已勾选状态，回升年线即自动清除）
  {
    const riskAuto = computeRiskAutoFocus(s.indices, s.funds);
    const kept = s.focus.filter(f=>!(f.source==='auto' && (f.key||'').indexOf('risk-')===0));
    const prev = {}; s.focus.forEach(f=>{ if(f.source==='auto' && (f.key||'').indexOf('risk-')===0) prev[f.key]=f; });
    riskAuto.forEach(a=>{
      const ex = prev[a.key];
      kept.push(ex ? ex : {key:a.key, source:'auto', done:false, createdAt:todayStr(), risk:true, autoText:{zh:a.zh, en:a.en}});
    });
    s.focus = kept;
    if(riskAuto.length) dirty=true;
  }
  if(dirty) persist(s);
  return s;
}

/* ============== 净资产成长曲线（真实资产 · 锚点7/1，>5年滚动） ============== */
function realTotalAsset(){
  const arr = (typeof SYNCED_HOLDINGS!=="undefined" && SYNCED_HOLDINGS.length) ? SYNCED_HOLDINGS : (MEM_SYNCED||[]);
  return arr.reduce((a,b)=>a+(parseFloat(b.market)||0),0) || 0;
}
// 资产配置自动归类（底层资产地：QDII投海外=境外）；返回 {cls}
const CODE_CLASS={"012920":{cls:"境外"}};
function classifyFund(h){
  if(h && CODE_CLASS[h.code]) return CODE_CLASS[h.code];
  const n=(h && h.name || "").toUpperCase();
  if(/QDII|全球|海外|纳斯达克|标普|道琼斯|美元|港股|HK|SP500|境外|国际|环球/.test(n)) return {cls:"境外"};
  if(/债券|转债|信用|国债|企业债|债基/.test(n)) return {cls:"国内债券"};
  if(/货币|理财|活期宝|现金|钱包|余额|货基/.test(n)) return {cls:"国内货币"};
  if(/黄金|商品|原油|大宗|REITs|不动产|另类/.test(n)) return {cls:"另类"};
  return {cls:"国内权益"};
}
function getSyncedHoldings(){
  const arr=(MEM_SYNCED && MEM_SYNCED.length) ? MEM_SYNCED
           : (typeof SYNCED_HOLDINGS!=="undefined" && SYNCED_HOLDINGS.length) ? SYNCED_HOLDINGS : [];
  return (arr||[]).filter(x=>x && (parseFloat(x.market)||0)>0);
}
function computeAllocation(){
  const hs=getSyncedHoldings();
  const order=["国内权益","国内债券","国内货币","另类","境外"];
  const bucket={}; order.forEach(k=>bucket[k]=0);
  let total=0;
  hs.forEach(h=>{ const m=parseFloat(h.market)||0; if(m<=0) return; total+=m; const c=classifyFund(h).cls; bucket[c]=(bucket[c]||0)+m; });
  const domMkt=total-(bucket["境外"]||0);
  const domPct=total>0?Math.round(domMkt/total*100):0;
  const ovPct=total>0?Math.round((bucket["境外"]||0)/total*100):0;
  const sorted=hs.map(h=>({code:h.code,name:h.name,mkt:parseFloat(h.market)||0})).sort((a,b)=>b.mkt-a.mkt);
  const top1=sorted.length?sorted[0].mkt/total*100:0;
  const hhi=total>0?hs.reduce((a,h)=>{ const p=(parseFloat(h.market)||0)/total; return a+p*p; },0)*10000:0;
  return {total,bucket,order,domMkt,domPct,ovPct,sorted,top1,hhi};
}
function svgPie(al){

// 今天日期 YYYY-MM-DD
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 上周一（固定锚点：本周一减7天）
function lastMonday(){ const e=new Date(); e.setHours(0,0,0,0); const dow=e.getDay(); const thisMon=new Date(e); thisMon.setDate(e.getDate()-((dow+6)%7)); const lm=new Date(thisMon); lm.setDate(thisMon.getDate()-7); return lm; }
function lastMondayStr(){ const d=lastMonday(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 净资产曲线固定锚点（优先取 state.nwAnchor，首次运行/缺失时用上周一）
function nwAnchorDate(){ const a=(typeof state!=="undefined" && state && state.nwAnchor)? new Date(state.nwAnchor+'T00:00:00') : lastMonday(); return a; }
// 净资产成长曲线：数据从「上周一」起持续记录、向后延伸（不滚动）；仅当跨度>5年才滚动（起点=今天-5年）
function netWorthWindow(realPoints){
  const end=new Date(); end.setHours(0,0,0,0);
  let start=new Date(nwAnchorDate());            // 固定锚点：上周一（首次运行写入 state.nwAnchor 后不再变）
  const cap=new Date(end); cap.setFullYear(cap.getFullYear()-5);
  if(start < cap) start = cap;                   // 超过5年才滚动为「近5年」窗口
  const days=Math.max(1,Math.round((end-start)/86400000));
  const map={}; (realPoints||[]).forEach(p=>{ if(p && p.d!=null) map[p.d]=p.v; });
  const arr=[];
  for(let i=0;i<=days;i++){ const d=new Date(start); d.setDate(start.getDate()+i);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    arr.push(map[key]!=null? {d:key, v:map[key]} : {d:key, v:null}); }
  return arr;
}

function svgLine(data){

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">

    ${g}${axis}${areas}${lines}${markers}${keyLabels}${labels}${note}

function svgFunnel(stages){
  if(!stages||!stages.length) return '<div class="muted" style="padding:20px;text-align:center">'+t('noData')+'</div>';
  const max=Math.max(...stages.map(s=>parseFloat(s.value)||0),1);
  const W=520, gap=10, n=stages.length;
  const bh=Math.floor((260-(n-1)*gap)/n);
  let svg=`<svg viewBox="0 0 ${W} 260" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">`;
  const colors=["#15a34a","#1f9e54","#34b36a","#5cc488","#86d4a8"];
  let prevR=null;
  stages.forEach((s,i)=>{
    const val=parseFloat(s.value)||0;
    const wTop=(val/max)*W;
    const nextVal=i<n-1?(parseFloat(stages[i+1].value)||0):0;
    const wBot=(nextVal/max)*W;
    const y=i*(bh+gap);
    const cx=W/2;
    const x1=cx-wTop/2, x2=cx+wTop/2, x3=cx+wBot/2, x4=cx-wBot/2;
    const c=colors[i%colors.length];
    const lbl=(lang==="zh"? (s.zh||s.label) : (s.en||s.label)) ;

    svg+=`<text x="${cx}" y="${y+bh/2+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${lbl} · ${val}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}
function svgGauge(value,min,max,zones){
  const v=Math.max(min,Math.min(max,parseFloat(value)||0));

  const a0=Math.PI, a1=0; // 180deg top semicircle

  const x2=cx+Math.cos(a1)*r, y2=cy-Math.sin(a1)*r;
  const nx=cx+Math.cos(ang)*r, ny=cy-Math.sin(ang)*r;
  let zoneColor=zones[zones.length-1].color;

  // background arc (over the top: sweep-flag 0)
  const bpath=`M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 0 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  // value arc (sweep from a0 to ang over the top)
  const vx=cx+Math.cos(ang)*r, vy=cy-Math.sin(ang)*r;
  const vpath=`M ${(cx+Math.cos(a0)*r).toFixed(1)} ${(cy-Math.sin(a0)*r).toFixed(1)} A ${r} ${r} 0 0 0 ${vx.toFixed(1)} ${vy.toFixed(1)}`;
  return `<svg viewBox="0 0 180 110" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <path d="${bpath}" fill="none" stroke="var(--track)" stroke-width="12" stroke-linecap="round"/>
    <path d="${vpath}" fill="none" stroke="${zoneColor}" stroke-width="12" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--text)"/>
    <text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${(+value).toFixed(value%1===0?0:1)}</text>
  </svg><div class="gz" style="color:${zoneColor}">${zl}</div>`;
}
function gaugeZones(type){
  if(type==="fearGreed") return [
    {max:0.25,color:"#d83a3a",label:t('zone.ef')},{max:0.45,color:"#d99100",label:t('zone.f')},
    {max:0.55,color:"#caa400",label:t('zone.n')},{max:0.75,color:"#15a34a",label:t('zone.g')},
    {max:1,color:"#0e7d38",label:t('zone.eg')}];
  if(type==="buffett") return [
    {max:0.535,color:"#15a34a",label:t('zone.cheap')},{max:0.642,color:"#34b36a",label:t('zone.low')},
    {max:0.857,color:"#caa400",label:t('zone.fair')},{max:1.071,color:"#d99100",label:t('zone.high')},
    {max:1,color:"#d83a3a",label:t('zone.exp')}];
  if(type==="graham") return [
    {max:0.333,color:"#d83a3a",label:t('zone.rich')},{max:0.5,color:"#d99100",label:t('zone.high')},
    {max:0.667,color:"#caa400",label:t('zone.fair')},{max:1,color:"#15a34a",label:t('zone.cheap')}];
  return [{max:1,color:"var(--primary)",label:""}];
}
function barMeter(value,min,max){
  const v=Math.max(min,Math.min(max,parseFloat(value)||0));
  const pct=Math.max(2,Math.min(100,((v-min)/(max-min))*100));
  return `<div class="pbar"><i style="width:${pct.toFixed(0)}%"></i></div>`;
}

/* ============== 市场情绪曲线（手写 SVG，零依赖） ============== */
function getBuffett(){ return (MEM_BUFFETT&&MEM_BUFFETT.length)?MEM_BUFFETT:(typeof SYNCED_BUFFETT!=="undefined"&&SYNCED_BUFFETT.length)?SYNCED_BUFFETT:[]; }
function getFng(){ return (MEM_FNG&&MEM_FNG.length)?MEM_FNG:(typeof SYNCED_FNG!=="undefined"&&SYNCED_FNG.length)?SYNCED_FNG:[]; }

// 通用折线图：series=[{d:"YYYY-MM-DD", v:Number}]；opts: {height,color,fill,refLines:[{y,label,color}],fmtY,yMin,yMax}
function svgLineChart(series, opts){
  opts=opts||{};
  const W=680, H=opts.height||240;
  const padL=48, padR=16, padT=14, padB=26;
  const pw=W-padL-padR, ph=H-padT-padB;
  if(!series||series.length<2) return "";
  const ts=series.map(p=>new Date(p.d+"T00:00:00").getTime());
  const tmin=ts[0], tmax=ts[ts.length-1];
  const vals=series.map(p=>p.v);
  let vmin=Math.min.apply(null,vals), vmax=Math.max.apply(null,vals);
  const refs=opts.refLines||[];
  refs.forEach(r=>{ if(r.y<vmin)vmin=r.y; if(r.y>vmax)vmax=r.y; });
  const vpad=(vmax-vmin)*0.08||1;
  let yMin=opts.yMin!=null?opts.yMin:(vmin-vpad);
  let yMax=opts.yMax!=null?opts.yMax:(vmax+vpad);
  if(yMin===yMax){ yMin-=1; yMax+=1; }
  const X=t=>padL+(tmax===tmin?0:(t-tmin)/(tmax-tmin)*pw);
  const Y=v=>padT+(1-(v-yMin)/(yMax-yMin))*ph;
  const fmtY=opts.fmtY||(v=>v.toFixed(0));
  const noLabels=!!opts.noLabels;
  // y 网格 + 刻度
  let gy=""; const yTicks=4;
  for(let i=0;i<=yTicks;i++){
    const v=yMin+(yMax-yMin)*i/yTicks, y=Y(v);
    gy+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL+pw}" y2="${y.toFixed(1)}" stroke="var(--track)" stroke-width="1" opacity="0.55"/>`;
    if(!noLabels) gy+=`<text x="${padL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtY(v)}</text>`;
  }
  // 参照线
  let rl="";
  refs.forEach(r=>{ const y=Y(r.y);
    rl+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL+pw}" y2="${y.toFixed(1)}" stroke="${r.color}" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.92"/>`;
    if(!noLabels && r.label) rl+=`<text x="${padL+pw}" y="${(y-4).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="${r.color}">${r.label}</text>`;
  });
  // x 轴年份刻度
  let xt="";
  const yrS=new Date(tmin).getFullYear(), yrE=new Date(tmax).getFullYear();
  const span=yrE-yrS, step=span>14?2:(span>7?1:1);
  for(let y=yrS;y<=yrE;y+=step){
    const d=new Date(y+"-01-01T00:00:00").getTime();
    if(d<tmin||d>tmax) continue;
    const x=X(d);
    xt+=`<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT+ph}" stroke="var(--track)" stroke-width="1" opacity="0.3"/>`;
    if(!noLabels) xt+=`<text x="${x.toFixed(1)}" y="${(padT+ph+16).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">${y}</text>`;
  }
  // 折线 + 面积
  let line="";
  series.forEach((p,i)=>{ line+=(i?"L":"M")+X(ts[i]).toFixed(1)+" "+Y(p.v).toFixed(1)+" "; });
  const area=`M ${X(ts[0]).toFixed(1)} ${(padT+ph).toFixed(1)} `+series.map((p,i)=>"L"+X(ts[i]).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")+` L ${X(ts[ts.length-1]).toFixed(1)} ${(padT+ph).toFixed(1)} Z`;
  const color=opts.color||"var(--primary)";
  // 关键数据点标注：起点 / 高点 / 低点 / 最后一点（同索引去重，避免重叠）
  const hiIdx = series.reduce((b,c,i,a)=>c.v>a[b].v?i:b, 0);
  const loIdx = series.reduce((b,c,i,a)=>c.v<a[b].v?i:b, 0);
  const ptGroup = {};
  [["起",0],["高",hiIdx],["低",loIdx],["末",series.length-1]].forEach(([tag,i])=>{
    (ptGroup[i]=ptGroup[i]||{i,tags:[]}).tags.push(tag);
  });
  let keyMarks="";
  Object.values(ptGroup).forEach(g=>{
    const x=X(ts[g.i]), y=Y(series[g.i].v);
    const onlyLow = g.tags.length===1 && g.tags[0]==="低";
    const dy = onlyLow ? 14 : -8;
    let anchor="middle";
    if(x < padL+30) anchor="start";
    else if(x > padL+pw-30) anchor="end";
    const tag = g.tags.sort((a,b)=>"起高低末".indexOf(a)-"起高低末".indexOf(b)).join("/");
    keyMarks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${color}" stroke="#fff" stroke-width="1.4"/>`+
      `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="800" fill="${color}">${tag}${fmtY(series[g.i].v)}</text>`;
  });
  // 第二条线：均线（如 MA250），日期须落在 [tmin,tmax]；v=null 处断开
  let maLine="", maLegend="";
  if(opts.maSeries && opts.maSeries.length){
    const maColor=opts.maColor||"#e8a317";
    let pen=false, mpath="";
    opts.maSeries.forEach(p=>{
      if(p.v==null||isNaN(p.v)){ pen=false; return; }
      const x=X(new Date(p.d+"T00:00:00").getTime()), y=Y(p.v);
      mpath+=(pen?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; pen=true;
    });
    maLine=`<path d="${mpath}" fill="none" stroke="${maColor}" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>`;
    if(opts.maLegend) maLegend=`<text x="${padL+pw}" y="${(padT+11).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="${maColor}">${opts.maLegend}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" rx="6" fill="var(--track)" opacity="0.10"/>
    ${gy}${rl}${xt}
    ${opts.fill?`<path d="${area}" fill="${color}" opacity="0.13"/>`:""}
    ${maLine}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${keyMarks}${maLegend}
  </svg>`;
}
// 单个情绪曲线卡片（含标题与当前值 + 图注）
function sentimentBlock(kind, opts){
  const series=kind==="buffett"?getBuffett():getFng();
  const title=kind==="buffett"?t("sent.buffett"):t("sent.fng");
  const cap=kind==="buffett"?t("sent.buffettCap"):t("sent.fngCap");
  const explain=kind==="fng"?`<div class="curve-explain">
    <div class="ce-title">${esc(t('sent.fngExplainTitle'))}</div>
    <div class="ce-body">${t('sent.fngExplain')}</div>
  </div>`:"";
  if(!series||series.length<2) return `<div class="curve-empty">${t("sentNoData")}</div>`;
  const last=series[series.length-1];
  const fmtY=opts.fmtY||(v=>v.toFixed(1));
  return `<div class="curve-wrap">
    <div class="curve-title">${esc(title)} <span class="curve-cur">${fmtY(last.v)}</span></div>
    ${svgLineChart(series, opts)}
    ${getAnomalyAnalysis(kind, last.v)}
    <div class="curve-cap">${esc(cap)}</div>
    ${explain}
    ${relAdviceHtml(kind)}
  </div>`;
}

// 异常值检测 + 蓝色分析
// 返回空字符串(正常) 或 <div class="anomaly-analysis">...</div>(异常)
function getAnomalyAnalysis(key, value){
  try {
    const cfg = ANOMALY_CONFIG[key]; if(!cfg) return "";
    const v = parseFloat(value); if(isNaN(v)) return "";
    // 判断偏离方向
    let level = "";
    if(v > cfg.max) level = v > cfg.max * 1.5 ? "extreme_high" : cfg.levelHigh || "high";
    else if(v < cfg.min) level = v < cfg.min * 0.5 ? "extreme_low" : cfg.levelLow || "low";
    else return ""; // 正常范围
    // 取分析文案
    const anal = level.indexOf("high")>=0 ? (cfg.highAnal||"") : (cfg.lowAnal||"");
    if(!anal) return "";
    // 方向标签
    const tag = level.indexOf("high")>=0 ? "⚠️ 偏高/过热" : "⚠️ 偏低/偏弱";
    const extremeTag = level==="extreme_high" ? "🔴 极端异常" : level==="extreme_low" ? "🔵 极端异常" : "";
    return `<div class="anomaly-analysis"><div class="anomaly-title">${extremeTag||tag} ${esc(key)}</div><div class="anomaly-body">${anal}</div></div>`;
  }catch(e){ return ""; }
}

// 从 SYNCED_MOMENTUM 内联数据中取时间序列
function getMomentumSeries(key){
  try {
    // 部署版 fetch 覆盖优先，其次内联 SYNCED_MOMENTUM
    if(MEM_MOMENTUM && MEM_MOMENTUM.indicators && MEM_MOMENTUM.indicators[key] && MEM_MOMENTUM.indicators[key].length){
      return MEM_MOMENTUM.indicators[key];
    }
    if(typeof SYNCED_MOMENTUM!=="undefined" && SYNCED_MOMENTUM && SYNCED_MOMENTUM.indicators && SYNCED_MOMENTUM.indicators[key]){
      return SYNCED_MOMENTUM.indicators[key]||[];
    }
  }catch(e){}
  return [];
}

// 单个动量指标曲线卡片
function momentumChartCard(key){
  const cfg = MOMENTUM_CHART_CFG[key];
  if(!cfg) return "";
  const series = getMomentumSeries(key);
  const lbl = t('sent.'+key);
  if(!series || series.length<2){
    return `<div class="curve-wrap" style="opacity:0.6">
      <div class="curve-title">${esc(lbl)} <span class="muted" style="font-size:11px">暂无序列数据</span></div>
      <div class="curve-empty" style="height:${cfg.height}px;display:flex;align-items:center;justify-content:center">需要运行 sync-momentum.py 同步</div>
      ${macroInfoHtml(key)}
    </div>`;
  }
  const last = series[series.length-1];
  const fmtY = cfg.fmtY||(v=>v.toFixed(1));
  // 数据跨度标注
  const firstD = series[0].d||"";
  const lastD = last.d||"";
  const spanNote = series.length>100 ? `${firstD.split('-')[0]}~${lastD.split('-')[0]} (${series.length}期)` : `${firstD}~${lastD} (${series.length}期)`;
  return `<div class="curve-wrap">
    <div class="curve-title">${esc(lbl)} <span class="curve-cur">${fmtY(last.v)}${cfg.unit?' '+esc(cfg.unit):''}</span> <span class="muted" style="font-size:10px;font-weight:400">${esc(spanNote)}</span></div>
    ${svgLineChart(series, cfg)}
    ${getAnomalyAnalysis(key, last.v)}
    ${macroInfoHtml(key)}
  </div>`;
}

function fmt(n){ if(n==null||isNaN(n)) return "0"; return n.toLocaleString("zh-CN",{maximumFractionDigits:0}); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1800); }
function stageKey(i){ return ["scr","fin","val","moat","buy"][i]||"scr"; }

function renderNewsCard(){

  items.sort((a,b)=>{
    const ai=a.n.important?1:0, bi=b.n.important?1:0;
    if(ai!==bi) return bi-ai;
    return (b.n.date||"").localeCompare(a.n.date||"");
  });
  const cap=s=>s? s.charAt(0).toUpperCase()+s.slice(1):"";
  const dateLabel=d=>{
    if(!d) return "";
    const today=new Date().toISOString().slice(0,10);
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(d===today) return d+" · 今天";
    if(d===y) return d+" · 昨天";
    return d;
  };
  const starSvg=on=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.8 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/></svg>`;
  let body="";
  if(items.length){
    let lastDate="";
    items.forEach(it=>{

      if((n.date||"")!==lastDate){ lastDate=n.date||""; body+=`<div class="news-date-h">${dateLabel(lastDate)}</div>`; }
      const starEl = `<span class="news-star ${star?'on':''}" style="cursor:default" title="${t('dashNewsImp')}">${starSvg(star)}</span>`;
      body += `
      <div class="news-item">

            <span class="tag auto">${t('dashNewsAuto')}</span>

        </div>
      </div>`;

  const chips = cats.map(([k,l])=>`<button class="news-chip ${newsFilter===k?'on':''}" data-newscat="${k}">${l}</button>`).join("");

  return `
  <div class="card" style="margin-bottom:16px">
    <h3>${t('dashNews')} <span class="tag">${items.length} ${t('dashNewsCount')}</span>

// 同步时间格式化
function fmtSync(iso){
  try{ const d=new Date(iso); const p=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

function trendSvg(d){
  if(d==="up") return '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 3l5 7H3z" fill="currentColor"/></svg>';
  if(d==="down") return '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 13L3 6h10z" fill="currentColor"/></svg>';
  return '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
}
function macroInfoHtml(key){
  const info = MACRO_INFO[key]; if(!info) return "";

  return `<div class="ind-info">
    <div class="ind-info-h">指标释义</div>
    <dl>
      <dt>含义</dt><dd>${esc(info.meaning)}</dd>
      <dt>影响</dt><dd>${esc(info.impact)}</dd>

    ${relAdviceHtml(key)}
  </div>`;
}

// ===== 指数&基金模块 helper =====
function _lcg(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function _genSeries(n, start, drift, vol, seed){
  const r=_lcg(seed); let v=start; const a=[];
  for(let i=0;i<n;i++){ v = v*(1+drift) + (r()-0.5)*vol; if(v<0.01)v=0.01; a.push(Math.round(v*1000)/1000); }
  return a;
}
function _parseNums(csv){ return String(csv||"").split(/[\s,;]+/).map(s=>parseFloat(s)).filter(x=>!isNaN(x)&&isFinite(x)); }
function _ma(arr, n){
  if(!Array.isArray(arr) || arr.length < n) return null;
  let s=0; for(let i=arr.length-n;i<arr.length;i++) s+=arr[i];
  return s/n;
}
function _parseDates(csv){ return String(csv||"").split(/[\s,;]+/).map(s=>s.trim()).filter(s=>/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(s)); }
function _calDays(a,b){ const da=new Date(a), db=new Date(b); if(isNaN(da)||isNaN(db)) return null; return Math.abs(Math.round((db-da)/86400000)); }
// 计算「最新值跌破其 N 日均线」的连续跌破天数与起始日索引（窗口对齐，旧->新）
function _belowRun(arr, n){
  const len=arr.length;
  if(len < n) return null;
  const ma=new Array(len).fill(null);
  let sum=0;
  for(let i=0;i<len;i++){
    sum+=arr[i];
    if(i>=n) sum-=arr[i-n];
    if(i>=n-1) ma[i]=sum/n; // 窗口 [i-(n-1)..i] 共 n 点
  }
  let run=0, firstIdx=-1;
  for(let i=len-1;i>=n-1;i--){
    if(ma[i]!=null && arr[i] < ma[i]){ run++; firstIdx=i; }
    else break;
  }
  return run>0 ? {days:run, breachIdx:firstIdx} : null;
}
// 自动待办：指数/基金最新值跌破其250日均线(年线) → 风险 + 减仓提示（含跌破日期与持续天数）
function computeRiskAutoFocus(indices, funds){
  const out=[];
  (indices||[]).forEach(x=>{
    const isPrice = !!x.idxSeries && String(x.idxSeries).trim()!=="";
    const arr=_parseNums(isPrice?x.idxSeries:x.peSeries), dates=_parseDates(isPrice?(x.idxDates||""):(x.peDates||""));
    const info=_belowRun(arr,250);
    if(info){
      let s=0; for(let i=arr.length-250;i<arr.length;i++) s+=arr[i];
      const maLast=s/250, cur=arr[arr.length-1], dev=(cur/maLast-1)*100;
      const aligned = dates.length===arr.length;
      const lastDate = aligned ? dates[arr.length-1] : "";
      const breachDate = (aligned && info.breachIdx>=0) ? dates[info.breachIdx] : "";
      const cal = (lastDate&&breachDate) ? _calDays(breachDate,lastDate) : null;
      const durTxt = cal!=null ? `${info.days} 个交易日（约 ${cal} 个自然日）` : `${info.days} 个交易日`;
      const kindTxt = isPrice ? "点位" : "PE";
      const curTxt = isPrice ? Math.round(cur) : cur.toFixed(1);
      const maTxt = isPrice ? Math.round(maLast) : maLast.toFixed(1);
      out.push({key:'risk-idx-'+(x.code||x.name||''),
        zh:`【风险】「${x.name||'指数'}」${kindTxt} 已于 ${breachDate||'近期'} 跌破250日均线（年线），截至 ${lastDate||'最新'} 已连续 ${durTxt}运行在年线下方（当前${kindTxt} ${curTxt}，年线均值 ${maTxt}，偏离 ${dev.toFixed(1)}%）。动能持续走弱，建议控制仓位、分批减仓`,
        en:`[RISK] ${x.name||'Index'} ${kindTxt} broke below its 250-day MA on ${breachDate||'recently'}; as of ${lastDate||'latest'} it has stayed below for ${durTxt} (${kindTxt} ${curTxt} vs avg ${maTxt}, ${dev.toFixed(1)}%). Trim/reduce`});
    }
  });
  (funds||[]).forEach(f=>{
    const arr=_parseNums(f.nav), dates=_parseDates(f.navDates);
    const info=_belowRun(arr,250);
    if(info){
      let s=0; for(let i=arr.length-250;i<arr.length;i++) s+=arr[i];
      const maLast=s/250, cur=arr[arr.length-1], dev=(cur/maLast-1)*100;
      const aligned = dates.length===arr.length;
      const lastDate = aligned ? dates[arr.length-1] : "";
      const breachDate = (aligned && info.breachIdx>=0) ? dates[info.breachIdx] : "";
      const cal = (lastDate&&breachDate) ? _calDays(breachDate,lastDate) : null;
      const durTxt = cal!=null ? `${info.days} 个交易日（约 ${cal} 个自然日）` : `${info.days} 个交易日`;
      out.push({key:'risk-fund-'+(f.code||f.name||''),
        zh:`【风险】「${f.name||'基金'}」(${f.code||''}) 净值已于 ${breachDate||'近期'} 跌破250日均线（年线），截至 ${lastDate||'最新'} 已连续 ${durTxt}低于年线（当前净值 ${cur.toFixed(3)}，年线 ${maLast.toFixed(3)}，偏离 ${dev.toFixed(1)}%）。趋势走弱，建议减仓 / 控制仓位`,
        en:`[RISK] ${f.name||'Fund'} (${f.code||''}) NAV broke below 250-day MA on ${breachDate||'recently'}; ${durTxt} below line (NAV ${cur.toFixed(3)} vs avg ${maLast.toFixed(3)}, ${dev.toFixed(1)}%). Reduce position`});
    }
  });
  return out;
}
function _idxPct(idx){
  const arr=_parseNums(idx.peSeries), pe=parseFloat(idx.pe);
  if(arr.length>=2 && pe>0){ let c=0; arr.forEach(x=>{ if(x<=pe)c++; }); return Math.round(c/arr.length*100); }
  return Math.max(0,Math.min(100, parseFloat(idx.pct)||0));
}
// 点位（价格）模式：当前点位在自身历史中的分位
function _idxPricePct(idx){
  const arr=_parseNums(idx.idxSeries);
  if(arr.length>=2){ const cur=arr[arr.length-1]; let c=0; arr.forEach(v=>{ if(v<=cur)c++; }); return Math.round(c/arr.length*100); }
  return 0;
}
function _verdict(pct, kind){
  let label;
  if(pct<30) label = (kind==="price") ? "低位" : t('idxLow');
  else if(pct<=70) label = (kind==="price") ? "中位" : t('idxMid');
  else label = (kind==="price") ? "高位" : t('idxHigh');
  if(pct<30) return {color:"#3B6D11", bg:"#EAF3DE", label};
  if(pct<=70) return {color:"#854F0B", bg:"#FAEEDA", label};
  return {color:"#A32D2D", bg:"#FCEBEB", label};
}
function _thermoHtml(pct){
  return `<div style="position:relative; height:10px; border-radius:5px; display:flex; overflow:hidden; margin:6px 0 8px;">
    <div style="flex:3; background:#C0DD97;"></div><div style="flex:4; background:#FAC775;"></div><div style="flex:3; background:#F7C1C1;"></div>
    <div style="position:absolute; top:-3px; bottom:-3px; left:${Math.max(0,Math.min(100,pct))}%; width:2px; background:#26215C;"></div>
  </div>`;
}
function _peHistSvg(x){
  const arr=_parseNums(x.peSeries);
  if(arr.length<2) return "";
  const cur=parseFloat(x.pe);
  const hi=Math.max.apply(null,arr), lo=Math.min.apply(null,arr);
  const med=arr.slice().sort((a,b)=>a-b)[Math.floor(arr.length/2)];
  const now=Date.now();
  const start=now-10*365*24*3600*1000; // 近10年窗口
  const series=arr.map((v,i)=>{
    const t=start+(now-start)*(arr.length<=1?0:i/(arr.length-1));
    const d=new Date(t);
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return {d:ds,v:v};
  });
  // MA250（近250点滚动均值；点数不足则省略）
  let maSeries=[];
  if(arr.length>=250){
    for(let i=249;i<arr.length;i++){
      let s=0; for(let j=i-249;j<=i;j++) s+=arr[j];
      maSeries.push({d:series[i].d, v:s/250});
    }
  }
  const refs=[
    {y:hi, label:"10年高 "+hi.toFixed(1), color:"#d83a3a"},
    {y:lo, label:"10年低 "+lo.toFixed(1), color:"#16a34a"},
    {y:med,label:"中位 "+med.toFixed(1), color:"#888"}
  ];
  if(cur>0 && !isNaN(cur)) refs.push({y:cur,label:"当前 "+cur.toFixed(1),color:"#26215C"});
  return svgLineChart(series,{height:200,color:"#2f6fed",fill:true,refLines:refs,fmtY:v=>v.toFixed(0),
    maSeries:maSeries, maColor:"#e8a317", maLegend:"┄ MA250"});
}
// 点位（价格）曲线：真实日期 + MA250 + 高/低/中位/当前 参照线
function _priceHistSvg(x){
  const arr=_parseNums(x.idxSeries), dates=_parseDates(x.idxDates);
  if(arr.length<2) return "";
  const aligned = dates.length===arr.length;
  const series = aligned ? arr.map((v,i)=>({d:dates[i], v:v})) : arr.map((v,i)=>{
    const now=Date.now(), start=now-10*365*24*3600*1000;
    const d=new Date(start+(now-start)*(arr.length<=1?0:i/(arr.length-1)));
    return {d:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"), v:v};
  });
  const cur=arr[arr.length-1];
  const hi=Math.max.apply(null,arr), lo=Math.min.apply(null,arr);
  const med=arr.slice().sort((a,b)=>a-b)[Math.floor(arr.length/2)];
  let maSeries=[];
  if(arr.length>=250){
    for(let i=249;i<arr.length;i++){
      let s=0; for(let j=i-249;j<=i;j++) s+=arr[j];
      maSeries.push({d:series[i].d, v:s/250});
    }
  }
  const refs=[
    {y:hi, label:"10年高 "+Math.round(hi), color:"#d83a3a"},
    {y:lo, label:"10年低 "+Math.round(lo), color:"#16a34a"},
    {y:med,label:"中位 "+Math.round(med), color:"#888"}
  ];
  refs.push({y:cur,label:"当前 "+Math.round(cur),color:"#26215C"});
  return svgLineChart(series,{height:200,color:"#2f6fed",fill:true,refLines:refs,fmtY:v=>v.toFixed(0),
    maSeries:maSeries, maColor:"#e8a317", maLegend:"┄ MA250"});
}
function _navBenchSvg(navArr, benchArr){
  const n=Math.min(navArr.length, benchArr.length); if(n<2) return "";
  const W=680,H=220,padL=46,padR=56,padT=18,padB=22, pw=W-padL-padR, ph=H-padT-padB;
  const nn=navArr.map(v=>v/navArr[0]*100), bb=benchArr.map(v=>v/benchArr[0]*100);
  // MA250（净值，仅点数≥250时绘制）
  let maNav=null;
  if(n>=250){
    maNav=[];
    for(let i=249;i<n;i++){ let s=0; for(let j=i-249;j<=i;j++) s+=nn[j]; maNav.push(s/250); }
  }
  let vmin=Math.min.apply(null,nn.concat(bb)), vmax=Math.max.apply(null,nn.concat(bb));
  const vp=(vmax-vmin)*0.12||1; vmin-=vp; vmax+=vp;
  const X=i=>padL+i/(n-1)*pw, Y=v=>padT+(1-(v-vmin)/(vmax-vmin))*ph;
  const mk=(arr)=>arr.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ").join("");
  // y 网格 + 数值刻度
  let gy=""; const yTicks=4;
  for(let i=0;i<=yTicks;i++){ const v=vmin+(vmax-vmin)*i/yTicks, y=Y(v);
    gy+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL+pw}" y2="${y.toFixed(1)}" stroke="var(--track)" stroke-width="1" opacity="0.5"/>`;
    gy+=`<text x="${padL-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toFixed(0)}</text>`;
  }
  // 基准线 100
  const yb=Y(100);
  const baseLine=`<line x1="${padL}" y1="${yb.toFixed(1)}" x2="${padL+pw}" y2="${yb.toFixed(1)}" stroke="#888" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>`;
  const baseLabel=`<text x="${padL+pw}" y="${(yb-4).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="#888">基准100</text>`;
  // 净值线关键数据点：起点/高点/低点/最后一点
  const nHi=nn.indexOf(Math.max.apply(null,nn)), nLo=nn.indexOf(Math.min.apply(null,nn));
  const nGrp={};
  [["起",0],["高",nHi],["低",nLo],["末",nn.length-1]].forEach(([tag,i])=>{
    (nGrp[i]=nGrp[i]||{i,tags:[]}).tags.push(tag);
  });
  let navMarks="";
  Object.values(nGrp).forEach(g=>{
    const x=X(g.i), y=Y(nn[g.i]);
    const onlyLow = g.tags.length===1 && g.tags[0]==="低";
    const dy = onlyLow ? 14 : -8;
    let anchor="middle";
    if(x < padL+28) anchor="start";
    else if(x > padL+pw-28) anchor="end";
    const tag = g.tags.sort((a,b)=>"起高低末".indexOf(a)-"起高低末".indexOf(b)).join("/");
    navMarks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--danger)" stroke="#fff" stroke-width="1.3"/>`+
      `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}" font-size="9.5" font-weight="800" fill="var(--danger)">${tag}${nn[g.i].toFixed(0)}</text>`;
  });
  // 末点数值（仅保留基准末点；净值末点已并入 navMarks）
  const lbi=bb.length-1;
  const endLabels=`<text x="${(X(lbi)+5).toFixed(1)}" y="${(Y(bb[lbi])+12).toFixed(1)}" font-size="10" font-weight="700" fill="var(--muted)">基准 ${bb[lbi].toFixed(0)}</text>`;
  // MA250 净值均线
  let maPath="";
  if(maNav){ let pen=false; for(let i=249;i<n;i++){ const x=X(i), y=Y(maNav[i-249]); maPath+=(pen?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; pen=true; } }
  const maLegend = maNav?`<text x="${padL+pw}" y="${(padT+11).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="#e8a317">┄ MA250(净值)</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" rx="6" fill="var(--track)" opacity="0.10"/>
    ${gy}${baseLine}${baseLabel}
    <path d="${mk(nn)}" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${mk(bb)}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4"/>
    ${maPath?`<path d="${maPath}" fill="none" stroke="#e8a317" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>`:""}
    ${navMarks}${endLabels}
    <text x="${padL}" y="${padT-4}" font-size="11" fill="var(--danger)" font-weight="700">● 净值(基=100)</text>
    <text x="${padL+96}" y="${padT-4}" font-size="11" fill="var(--muted)" font-weight="700">┄ 基准(基=100)</text>
    ${maLegend}
  </svg>`;
}
function _drawdownSvg(arr){
  const n=arr.length; if(n<2) return "";
  let peak=-Infinity, dd=[]; arr.forEach(v=>{ if(v>peak)peak=v; dd.push(peak>0?(v-peak)/peak*100:0); });
  let mn=Math.min.apply(null,dd); if(mn>0)mn=0;
  const W=680,H=130,padL=42,padR=46,padT=12,padB=14, pw=W-padL-padR, ph=H-padT-padB;
  const yMin=Math.floor(mn)-1, yMax=2;
  const X=i=>padL+i/(n-1)*pw, Y=v=>padT+(1-(v-yMin)/(yMax-yMin))*ph;
  let line="", area="M "+X(0).toFixed(1)+" "+Y(0).toFixed(1);
  dd.forEach((v,i)=>{ line+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" "; area+=" L"+X(i).toFixed(1)+" "+Y(v).toFixed(1); });
  area+=" L "+X(n-1).toFixed(1)+" "+Y(0).toFixed(1)+" Z";
  const maxdd=Math.min.apply(null,dd), curdd=dd[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" rx="6" fill="var(--track)" opacity="0.10"/>
    <path d="${area}" fill="var(--danger)" opacity="0.16"/>
    <path d="${line}" fill="none" stroke="var(--danger)" stroke-width="1.8"/>
    <line x1="${padL}" y1="${Y(0).toFixed(1)}" x2="${padL+pw}" y2="${Y(0).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="${padL-5}" y="${(Y(0)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">0%</text>
    <text x="${padL+pw}" y="${(Y(maxdd)-4).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--danger)">最大回撤 ${maxdd.toFixed(1)}%</text>
    <text x="${X(n-1).toFixed(1)}" y="${(Y(curdd)-5).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="var(--danger)">当前 ${curdd.toFixed(1)}%</text>
  </svg>`;
}

    else advice="点位处于历史偏高区，水位不便宜、回调风险上升；建议控制仓位、不追高，若已大幅获利可逐步兑现，保留弹药等待回踩。";

      <div class="ra-row"><span class="ra-k">建议</span><span class="ra-v">${advice}</span></div>
    </div>`;
  }
  const v=_verdict(pct,"pe");
  const pe=parseFloat(x.pe), pb=parseFloat(x.pb);
  let advice;

  else if(pct<=70) advice="估值处于历史中性区间，定价相对合理。以持有为主，出现明显回调可小幅加仓，避免追高；维持既定仓位节奏，等待趋势进一步明朗。";
  else advice="估值处于历史偏高区间，性价比下降、回调风险上升。建议控制仓位、分批止盈、不追高；若已大幅盈利可逐步兑现锁定收益，保留弹药等待估值回归。";
  const peTxt=(!isNaN(pe)&&pe>0)?`当前PE ${pe.toFixed(1)}`:"";
  const pbTxt=(!isNaN(pb)&&pb>0)?` · PB ${pb.toFixed(2)}`:"";
  return `<div class="rel-advice">
    <div class="ra-h">水位分析与建议</div>
    <div class="ra-row"><span class="ra-k">当前水位</span><span class="ra-v"><b style="color:${v.color}">${v.label}</b>（历史分位 ${pct}%${peTxt}${pbTxt}）</span></div>
    <div class="ra-row"><span class="ra-k">建议</span><span class="ra-v">${advice}</span></div>
  </div>`;

// 基金卡：表现分析 + 投资建议
function _fundAnalysisHtml(s){

  const benchTxt = (br!=null)?`（基准 ${br>=0?'+':''}${br.toFixed(1)}%）`:"（暂无基准对比）";
  let advice;

  else if(ex!=null && ex>=0 && maxdd<-20) advice="虽跑赢基准但区间回撤偏大，需注意仓位与风控；可考虑分批止盈锁定部分收益，或设置回撤警戒线。";

  </div>`;
}

function gcGetNav(code){
  if(typeof SYNCED_INDEX!=="undefined" && SYNCED_INDEX && Array.isArray(SYNCED_INDEX.funds)){

    if(f){

// 在线拉取天天基金全历史净值（pingzhongdata.js，单文件包含全部净值，CORS 兼容 script-tag）
function gcFetchNavOnline(code){
  return new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = `https://fund.eastmoney.com/pingzhongdata/${encodeURIComponent(code)}.js?t=${Date.now()}`;
    script.async = true;
    const tid = setTimeout(()=>{ cleanup(); reject(new Error('净值接口超时，请尝试粘贴净值序列')); }, 15000);
    function cleanup(){ clearTimeout(tid); script.remove(); }
    script.onload = ()=>{
      try {
        const trend = window.Data_netWorthTrend;
        const name = window.fS_name || code;
        if(!trend || !Array.isArray(trend) || trend.length < 2){
          cleanup(); reject(new Error('未返回有效净值数据')); return;
        }
        const data = trend.map(p=>{
          const d = new Date(p.x);
          const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          return [ds, Number(p.y)];
        }).filter(p=>p[0]&&isFinite(p[1])).sort((a,b)=>a[0]<b[0]?-1:1);
        // 清掉全局变量，避免后续不同代码串扰
        try { window.Data_netWorthTrend = undefined; window.fS_name = undefined; } catch(_){}
        cleanup();
        resolve({src:"online", name:`${name}(${code})`, data});
      } catch(e){ cleanup(); reject(e); }
    };
    script.onerror = ()=>{ cleanup(); reject(new Error('净值接口加载失败，请尝试粘贴净值序列')); };
    document.head.appendChild(script);
  });
}
